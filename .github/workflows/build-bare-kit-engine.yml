# Builds a custom-engine Android libbare-kit.so from holepunchto/bare-kit, so the
# app can ship a smaller JS engine (QuickJS/Jerry/JSC) instead of V8 — produced
# reproducibly in CI instead of committed as an opaque binary blob.
#
# Mirrors bare-kit's own publish.yml `android:` job, adding -DBARE_ENGINE.
# Output: artifact `bare-kit-<engine>-android` containing <abi>/libbare-kit.so
# for arm64-v8a, armeabi-v7a, x86, x86_64. Drop it into
# packages/app/bare-kit-engine/<engine>/ to use it.
name: Build BareKit engine (Android)

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine binding (BARE_ENGINE = github:holepunchto/<engine>)
        required: true
        default: libqjs
        type: choice
        options: [libqjs, libmqjs, libjsc, libjerry, libjs]
      bare_kit_ref:
        description: bare-kit git ref/tag to build (must match the version react-native-bare-kit fetches)
        required: true
        default: v2.2.0
        type: string

jobs:
  build-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout bare-kit
        uses: actions/checkout@v6
        with:
          repository: holepunchto/bare-kit
          ref: ${{ inputs.bare_kit_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Inject BARE_ENGINE into the Android cmake build
        run: |
          set -euo pipefail
          ENGINE="github:holepunchto/${{ inputs.engine }}"
          # Append -DBARE_ENGINE to the existing externalNativeBuild cmake arguments.
          perl -0pi -e \
            's/("-DANDROID_STL=c\+\+_shared")/$1, "-DBARE_ENGINE='"$ENGINE"'"/g' \
            android/build.gradle
          echo "----- android/build.gradle cmake arguments -----"
          grep -n "BARE_ENGINE\|ANDROID_STL\|arguments" android/build.gradle || true

      - name: Patch QJS worklet bootstrap handoff
        run: |
          set -euo pipefail
          git apply <<'PATCH'
          diff --git a/shared/worklet.c b/shared/worklet.c
          index 41dd19c..c60e25f 100644
          --- a/shared/worklet.c
          +++ b/shared/worklet.c
          @@ -437,10 +437,28 @@ bare_worklet__on_thread(void *opaque) {
             err = bare_load(bare, "bare:/worklet.bundle", &source, &module);
             assert(err == 0);

          +  js_value_t *global;
          +  err = js_get_global(env, &global);
          +  assert(err == 0);
          +
             js_value_t *exports;
          -  err = js_get_named_property(env, module, "exports", &exports);
          +  err = js_get_named_property(env, global, "__BareKitWorkletBootstrap", &exports);
          +  assert(err == 0);
          +
          +  bool exports_is_undefined;
          +  err = js_is_undefined(env, exports, &exports_is_undefined);
             assert(err == 0);

          +  if (exports_is_undefined) {
          +    err = js_get_named_property(env, module, "exports", &exports);
          +    assert(err == 0);
          +
          +    err = js_is_undefined(env, exports, &exports_is_undefined);
          +    assert(err == 0);
          +
          +    if (exports_is_undefined) exports = module;
          +  }
          +
             js_value_t *port;
             err = js_get_named_property(env, exports, "port", &port);
             assert(err == 0);
          diff --git a/shared/worklet.js b/shared/worklet.js
          index 44e5909..5f8f298 100644
          --- a/shared/worklet.js
          +++ b/shared/worklet.js
          @@ -13,7 +13,6 @@ const IPC = require('bare-ipc')
           const unpack = require('bare-unpack')

           global.console = new Console(new SystemLog())
          -
           const ports = IPC.open()

           const ipc = new IPC(ports[0])
          @@ -123,4 +122,12 @@ exports.start = async function start(filename, source, assets) {
             return Module.load(url, source)
           }

          +// QJS does not reliably expose this CommonJS module as the bare_load() return value.
          +Object.defineProperty(global, '__BareKitWorkletBootstrap', {
          +  value: exports,
          +  enumerable: false,
          +  writable: false,
          +  configurable: true
          +})
          +
           function noop() {}
          PATCH

      - run: npm install --global cmake-runtime ninja-runtime
      - run: npm install

      - name: Build release AAR (gradle aR)
        run: gradle aR --no-daemon

      - name: Extract per-ABI libbare-kit.so from the AAR
        run: |
          set -euo pipefail
          AAR=$(find android/build/outputs/aar -name '*-release.aar' | head -1)
          echo "AAR: $AAR"
          mkdir -p out
          unzip -o "$AAR" 'jni/*/libbare-kit.so' -d aar-extract
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            SO="aar-extract/jni/$abi/libbare-kit.so"
            if [ -f "$SO" ]; then
              mkdir -p "out/$abi"
              cp "$SO" "out/$abi/libbare-kit.so"
              printf '  %-12s %s\n' "$abi" "$(du -h "$SO" | cut -f1)"
            else
              echo "::warning::missing $SO"
            fi
          done
          {
            echo "### BareKit engine build (${{ inputs.engine }} @ ${{ inputs.bare_kit_ref }})"
            echo '| ABI | libbare-kit.so |'
            echo '|---|---|'
            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              [ -f "out/$abi/libbare-kit.so" ] && \
                echo "| $abi | $(du -h "out/$abi/libbare-kit.so" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: bare-kit-${{ inputs.engine }}-android
          path: out/**/libbare-kit.so
          if-no-files-found: error
          retention-days: 14
