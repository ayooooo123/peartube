name: Build bare-mpv prebuilds

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.1)'
        required: false
        default: ''
  push:
    paths:
      - 'packages/bare-mpv/**'
    branches:
      - main

env:
  SKIP_POSTINSTALL: 1

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build prerequisites
        run: |
          brew install meson ninja pkg-config nasm fribidi harfbuzz fontconfig automake

      - name: Install npm dependencies
        working-directory: packages/bare-mpv
        run: npm install

      - name: Build native addon (static mpv from vendor)
        working-directory: packages/bare-mpv
        run: |
          npx bare-make generate
          npx bare-make build
          npx bare-make install

      - name: Verify prebuild was created
        working-directory: packages/bare-mpv
        run: |
          ls -la prebuilds/darwin-arm64/
          file prebuilds/darwin-arm64/bare-mpv.bare

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-darwin-arm64
          path: packages/bare-mpv/prebuilds/darwin-arm64/bare-mpv.bare

  build-linux:
    strategy:
      matrix:
        include:
          - arch: x64
            prebuild_dir: linux-x64
            docker_platform: linux/amd64
          - arch: arm64
            prebuild_dir: linux-arm64
            docker_platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (for ARM64 emulation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build in Docker container
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/packages/bare-mpv \
            -e SKIP_POSTINSTALL=1 \
            -e CI=true \
            node:20-bookworm \
            bash -c "
              set -ex
              apt-get update
              apt-get install -y \
                cmake ninja-build pkg-config \
                python3-pip python3-venv \
                nasm patch \
                clang lld \
                libdrm-dev \
                libpipewire-0.3-dev \
                libspa-0.2-dev \
                libfribidi-dev \
                libharfbuzz-dev \
                libfontconfig1-dev
              
              pip3 install --break-system-packages meson
              
              npm install
              
              npx bare-make generate
              npx bare-make build
              npx bare-make install
              
              ls -la prebuilds/${{ matrix.prebuild_dir }}/
              file prebuilds/${{ matrix.prebuild_dir }}/bare-mpv.bare
            "

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.prebuild_dir }}
          path: packages/bare-mpv/prebuilds/${{ matrix.prebuild_dir }}/bare-mpv.bare

  collect-prebuilds:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: packages/bare-mpv/prebuilds
          merge-multiple: false

      - name: Move prebuilds to correct directories
        run: |
          cd packages/bare-mpv/prebuilds
          for dir in prebuild-*; do
            target="${dir#prebuild-}"
            mkdir -p "$target"
            mv "$dir/bare-mpv.bare" "$target/"
            rmdir "$dir"
          done

      - name: List prebuilds
        run: |
          echo "=== All prebuilds ==="
          find packages/bare-mpv/prebuilds -name "*.bare" -exec ls -lh {} \;
          echo ""
          echo "=== File types ==="
          find packages/bare-mpv/prebuilds -name "*.bare" -exec file {} \;

      - name: Commit prebuilds to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/bare-mpv/prebuilds/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(bare-mpv): update prebuilds [skip ci]"
            git push
          fi
