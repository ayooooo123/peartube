<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PearTube · permissionless media CDN</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --accent:#eb6c36; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; background:var(--paper); color:var(--ink); font-family:'Geist',system-ui,sans-serif; }
    .frame { width:100%; max-width:1200px; }
    .eyebrow { margin-bottom:.5rem; color:var(--muted); font-family:'Geist Mono',monospace; font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:1.5rem; color:var(--ink); font-family:'Instrument Serif',serif; font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · PearTube</p>
    <h1>Permissionless catalog, verified media, local authority</h1>
    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">PearTube permissionless media CDN architecture</title>
      <desc id="architecture-desc">Client shells and MediaStorm use a relay companion and universal backend that verify signed catalogs, enforce local participation policy, transfer immutable assets over scoped peer sessions, and optionally offload verified blocks to S3-compatible storage.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="960" height="640" fill="#f5f5f5"/>

      <!-- zones -->
      <rect x="48" y="48" width="864" height="112" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <rect x="416" y="52" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="64" fill="rgba(45,49,66,.50)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".14em">CONSUMERS</text>

      <rect x="48" y="184" width="864" height="264" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <rect x="400" y="188" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="200" fill="rgba(45,49,66,.50)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".14em">UNIVERSAL BACKEND</text>

      <rect x="48" y="472" width="864" height="112" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.10)" stroke-width=".8"/>
      <rect x="392" y="476" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="488" fill="rgba(45,49,66,.50)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".14em">DISTRIBUTION</text>

      <!-- connectors -->
      <line x1="256" y1="136" x2="256" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M704 136 V176 Q704 184 712 184 V224" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="352" y1="256" x2="400" y2="256" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="560" y1="256" x2="608" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M480 288 V312 Q480 320 472 320 H256 Q248 320 248 328 V352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="288" x2="480" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M512 288 V312 Q512 320 520 320 H704 Q712 320 712 328 V352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="416" x2="480" y2="504" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M712 416 V448 Q712 456 720 456 H792 Q800 456 800 464 V504" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- nodes -->
      <rect x="128" y="80" width="256" height="56" rx="8" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="256" y="104" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Mobile · Desktop</text>
      <text x="256" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Expo · BareKit · Electrobun</text>

      <rect x="576" y="80" width="256" height="56" rx="8" fill="rgba(46,90,168,.06)" stroke="rgba(46,90,168,.55)"/>
      <text x="704" y="104" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">MediaStorm</text>
      <text x="704" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">ranking · private acquisition</text>

      <rect x="144" y="224" width="208" height="64" rx="8" fill="#f5f5f5" stroke="#4f5d75"/>
      <text x="248" y="248" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Platform + Host</text>
      <text x="248" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">HRPC · readiness · version</text>

      <rect x="400" y="224" width="160" height="64" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="480" y="248" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Backend</text>
      <text x="480" y="268" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">one implementation</text>

      <rect x="608" y="224" width="208" height="64" rx="8" fill="#f5f5f5" stroke="#2e5aa8"/>
      <text x="712" y="248" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Relay Companion</text>
      <text x="712" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">authenticated /api/v2</text>

      <rect x="144" y="352" width="208" height="64" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="248" y="376" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Catalog + Index</text>
      <text x="248" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">signed · bounded · local</text>

      <rect x="376" y="352" width="208" height="64" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="480" y="376" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Immutable Assets</text>
      <text x="480" y="396" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">verified rendition ranges</text>

      <rect x="608" y="352" width="208" height="64" rx="8" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="712" y="376" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Local Policy + State</text>
      <text x="712" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">moderation · consent · budgets</text>

      <rect x="160" y="504" width="480" height="56" rx="8" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.30)"/>
      <text x="400" y="528" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Scoped P2P Network</text>
      <text x="400" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">bootstrap · publisher · index · asset · archive</text>

      <rect x="688" y="504" width="224" height="56" rx="8" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.30)" stroke-dasharray="4,3"/>
      <text x="800" y="528" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">S3-Compatible Tier</text>
      <text x="800" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">optional verified blocks</text>

      <line x1="48" y1="608" x2="912" y2="608" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
      <text x="48" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">AUTHORITY STAYS LOCAL</text>
      <text x="224" y="628" fill="#4f5d75" font-size="8" font-style="italic">Catalog presence, live reachability, and archival durability remain separate facts.</text>
    </svg>
  </main>
</body>
</html>
