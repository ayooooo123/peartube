mode: public
policy: discovery

storage:
  path: /var/lib/peartube-relay
  maxBytes: 107374182400

admission:
  channels: []
  owners: []

seedPin:
  enabled: true
  maxBytes: 536870912000
  maxConcurrent: 2
  retentionDays: 30       # 0 allows immediate release; disable reception with enabled: false
  trustedClients: []     # exact 32-byte identity public keys (hex), never device/transport keys

discovery:
  enabled: true
  maxChannels: 500
  maxChannelsPerOwner: 20

# Optional: interactive `peartube add` content-import preferences.
# Environment variables always override these (TMDB_API_KEY, PEARTUBE_YTDLP_PATH,
# PEARTUBE_YTDLP_COOKIES) and secret-bearing files are written with mode 0600.
content:
  storagePath: ~/.peartube/content
  tmdbApiKey: ""          # TMDB read token; leave blank to use TMDB_API_KEY
  ytDlpPath: yt-dlp       # yt-dlp executable path or PATH name
  ytDlpCookiesPath: ""    # optional cookies file, validated but never logged
  searchLimit: 12
  claimRetentionDays: 30

# Optional: archive YouTube channels into PearTube channels owned by this relay.
# Each source URL maps to one PearTube channel (deterministic per relay identity).
# yt-dlp must be available in PATH (the relay Docker image bundles it).
archive:
  enabled: false
  poll: 3600              # seconds between polls per source
  maxItems: 50            # videos to consider per poll, newest first
  maxRetries: 3           # give up on a video after this many consecutive failures
  budgetReservePercent: 5 # stop archiving when within N% of storage.maxBytes
  format: "bv*+ba/b"       # preserve original best video+audio when yt-dlp provides separate streams
  tmpPath: /var/lib/peartube-relay/archive-tmp  # yt-dlp scratch dir
  sources:
    - url: https://www.youtube.com/@somechannel
      label: Some Channel
    # - url: https://www.youtube.com/playlist?list=PLxxxxxxx

logging:
  level: info
