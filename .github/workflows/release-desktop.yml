name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for example v1.0.0). Leave empty to build from the current ref.
        required: false
        type: string

permissions:
  contents: write

jobs:
  electrobun-desktop-release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Generate HRPC schema
        run: npm run schema

      - name: Build desktop app
        working-directory: packages/app
        run: |
          npm run desktop:build
          npm run desktop:ebuild

      - name: Package Electrobun desktop release artifact
        working-directory: packages/app
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          RELEASE_TAG="$REQUESTED_TAG"
          if [ -z "$RELEASE_TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            build/dev-macos-arm64/PearTube-dev.app \
            build/PearTube-electrobun-${VERSION}.zip

      - name: Upload Electrobun release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-electrobun-release
          path: packages/app/build/PearTube-electrobun-*.zip
          retention-days: 30

  native-desktop-release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Install native desktop dependencies
        run: npm install --prefix packages/desktop-native

      - name: Generate HRPC schema
        run: npm run schema:full

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate native desktop project
        working-directory: packages/desktop-native
        run: npm run generate

      - name: Archive native desktop release build
        working-directory: packages/desktop-native
        run: |
          xcodebuild \
            -project PearTubeDesktop.xcodeproj \
            -scheme PearTubeDesktop \
            -configuration Release \
            -archivePath build/PearTubeDesktop.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package native desktop release artifact
        working-directory: packages/desktop-native
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          RELEASE_TAG="$REQUESTED_TAG"
          if [ -z "$RELEASE_TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            build/PearTubeDesktop.xcarchive \
            build/PearTube-native-desktop-${VERSION}.zip

      - name: Upload native desktop release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-native-desktop-release
          path: packages/desktop-native/build/PearTube-native-desktop-*.zip
          retention-days: 30

  publish-desktop-release:
    needs:
      - electrobun-desktop-release
      - native-desktop-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    permissions:
      contents: write
    steps:
      - name: Download desktop release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*.zip
          generate_release_notes: true
          draft: false
