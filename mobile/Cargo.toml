[package]
name = "peartube"
version = "0.4.4"
edition = "2024"
publish = false

# dx takes the app's display name from the binary name.
[[bin]]
name = "PearTube"
path = "src/main.rs"

[dependencies]
dioxus = { version = "=0.7.10", features = [] }
futures-channel = "0.3"
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The video player: peartube-media's engine, OxideAV codecs and the
# platform video decoders. See [patch.crates-io] below.
player = { git = "https://github.com/ayooooo123/peartube-media", rev = "c31659966423e1def206c180640de6e1aed1b617" }
codecs = { git = "https://github.com/ayooooo123/peartube-media", rev = "c31659966423e1def206c180640de6e1aed1b617" }
oxideav-core = "*"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"

# The player's picture: a native view inside the webview.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "UIResponder", "UIView"] }

[dev-dependencies]
futures-executor = "0.3"
sha2 = "0.10"
ureq = { version = "3", default-features = false }

[build-dependencies]
serde_json = "1"

[features]
default = ["mobile"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

# libmain.so shipped with debug info: 25.8 MB unpacked, 16.7 MB stripped.
# LTO drops the codec code the player never calls (OxideAV crates carry
# encoders too). Unwinding stays on: the player catches decoder panics.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

# Video decoding unoptimized is too slow to watch; keep the app's own code
# quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

# BEGIN pin-oxideav
