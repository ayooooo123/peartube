name: PearTubeDesktop
options:
  bundleIdPrefix: com.peartube
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    PRODUCT_NAME: PearTubeDesktop
    PRODUCT_BUNDLE_IDENTIFIER: com.peartube.desktop.native
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  PearTubeDesktop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
    resources:
      - Resources
    entitlements:
      path: Resources/PearTubeDesktop.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Resources/Info.plist
      properties:
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: PearTube Native
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: NO

  PearTubeDesktopTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests
    dependencies:
      - target: PearTubeDesktop
    info:
      path: Resources/Tests-Info.plist
      properties:
        CFBundleName: PearTubeDesktopTests
        CFBundleIdentifier: com.peartube.desktop.native.tests
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_NAME: PearTubeDesktopTests
        PRODUCT_MODULE_NAME: PearTubeDesktopTests

schemes:
  PearTubeDesktop:
    build:
      targets:
        PearTubeDesktop: all
        PearTubeDesktopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PearTubeDesktopTests
    archive:
      config: Release
