<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One device joins a channel</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · channel pairing</p>
    <h1>One device joins a channel, using a code you can read aloud</h1>

    <svg viewBox="0 0 1000 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="one-device-joins-title one-device-joins-desc">
      <title id="one-device-joins-title">Adding a second device to a channel</title>
      <desc id="one-device-joins-desc">Sequence diagram with three participants: the owner device, the blind-pairing rendezvous on the DHT, and a new device. The owner mints an invite from the channel key and listens as a member. The invite code travels out of band to the human. The new device decodes it and joins as a candidate, offering its writer key. The rendezvous delivers that key to the owner, which records the device in a roster and confirms with the channel key and encryption key, highlighted as the moment access is granted. The invite is then consumed.</desc>

      <defs>
        <pattern id="one-device-joins-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="one-device-joins-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="one-device-joins-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
        <marker id="one-device-joins-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#one-device-joins-dots)" opacity="0.55"/>

      <!-- Actors -->
      <rect x="80" y="56" width="200" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Owner device</text>
      <text x="180" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">holds the channel core</text>

      <rect x="420" y="56" width="200" height="44" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="520" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rendezvous</text>
      <text x="520" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blind-pairing on the DHT</text>

      <rect x="760" y="56" width="200" height="44" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="860" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New device</text>
      <text x="860" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">has only the code</text>

      <!-- Lifelines -->
      <line x1="180" y1="100" x2="180" y2="536" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="520" y1="100" x2="520" y2="536" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="860" y1="100" x2="860" y2="536" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="176" y="132" width="8" height="380" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="856" y="264" width="8" height="248" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- 1. mint invite (self) -->
      <path d="M 184,144 H 236 V 168 H 188" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-device-joins-arrow)"/>
      <text x="252" y="150" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">createInvite(channelKey)</text>
      <text x="252" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">z32 string · stored in the invites table</text>

      <!-- 2. listen as member -->
      <line x1="184" y1="200" x2="512" y2="200" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-device-joins-arrow)"/>
      <text x="348" y="192" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">addMember(discoveryKey)</text>
      <text x="348" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">now listening for candidates</text>

      <!-- 3. out of band -->
      <line x1="184" y1="248" x2="852" y2="248" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#one-device-joins-arrow-open)"/>
      <text x="518" y="240" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">the code, out of band</text>
      <text x="518" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">read aloud, texted, scanned — never over the DHT</text>

      <!-- 4. decode (self) -->
      <path d="M 856,296 H 908 V 320 H 860" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-device-joins-arrow)"/>
      <text x="692" y="302" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="end">z32.decode(code)</text>
      <text x="692" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">invalid code fails here, locally</text>

      <!-- 5. addCandidate -->
      <line x1="852" y1="352" x2="528" y2="352" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-device-joins-arrow)"/>
      <text x="690" y="344" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">addCandidate(invite)</text>
      <text x="690" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">userData = its own writer key</text>

      <!-- 6. onadd to owner -->
      <line x1="512" y1="392" x2="184" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-device-joins-arrow)"/>
      <text x="348" y="384" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">onadd(req)</text>
      <text x="348" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">carries the candidate's writer key</text>

      <!-- 7. record in roster (self) -->
      <path d="M 184,432 H 236 V 456 H 188" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-device-joins-arrow)"/>
      <text x="252" y="438" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">addWriter(key, role)</text>
      <text x="252" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">roles: device · moderator · owner — only an owner may add</text>

      <!-- 8. confirm — headline -->
      <line x1="188" y1="488" x2="852" y2="488" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#one-device-joins-arrow-accent)"/>
      <text x="518" y="480" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">confirm(channelKey, encryptionKey)</text>
      <text x="518" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the invite is deleted immediately after — one use</text>

      <!-- 9. open (self) -->
      <path d="M 856,516 H 908 V 532 H 860" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-device-joins-arrow)"/>
      <text x="692" y="522" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="end">open the channel DB</text>

      <!-- Captions -->
      <text x="80" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHY BLIND</text>
      <text x="216" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The rendezvous never learns the channel key. It matches two peers who both derived the same discovery key from the invite, and the real keys pass only inside the confirmed exchange.</text>
      <text x="80" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHAT IT GRANTS</text>
      <text x="216" y="592" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The confirm hands over the channel key and encryption key — read access to the same Hypercore, plus a row in the writers roster. It does not hand over the core's secret key.</text>
      <text x="80" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">READ HONESTLY</text>
      <text x="216" y="616" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">So the roster is a roster, not an authorisation. Real multi-writer would need Autobase, which this path does not use — see the note at pairer.js:116 and CLEANUP_PLAN.md.</text>
    </svg>
  </div>
</body>
</html>
