name: Build Desktop

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/desktop-native/**'
      - 'packages/backend/**'
      - 'packages/platform/**'
      - 'packages/spec/**'
      - 'packages/bare-*/**'
      - '.github/actions/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  electrobun-desktop-build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Generate HRPC schema
        run: npm run schema

      - name: Build desktop web/export assets
        working-directory: packages/app
        run: npm run desktop:build

      - name: Build Electrobun desktop app
        working-directory: packages/app
        run: npm run desktop:ebuild

      - name: Package Electrobun desktop app artifact
        working-directory: packages/app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/dev-macos-arm64/PearTube-dev.app \
            build/PearTube-electrobun-dev-macos-arm64.zip

      - name: Upload Electrobun desktop app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-electrobun-desktop
          path: packages/app/build/PearTube-electrobun-dev-macos-arm64.zip
          retention-days: 7

  native-desktop-test:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Install native desktop dependencies
        run: npm install --prefix packages/desktop-native

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate HRPC schema
        run: npm run schema:full

      - name: Run native desktop tests
        run: npm run desktop:native:test

  native-desktop-archive:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Install native desktop dependencies
        run: npm install --prefix packages/desktop-native

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate native desktop project
        working-directory: packages/desktop-native
        run: npm run generate

      - name: Archive native desktop release build
        working-directory: packages/desktop-native
        run: |
          xcodebuild \
            -project PearTubeDesktop.xcodeproj \
            -scheme PearTubeDesktop \
            -configuration Release \
            -archivePath build/PearTubeDesktop.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload native desktop archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-native-desktop-archive
          path: packages/desktop-native/build/PearTubeDesktop.xcarchive
          retention-days: 14
