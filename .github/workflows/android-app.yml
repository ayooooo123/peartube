name: Android app

# Builds the Kotlin app's debug APK (arm64) and keeps it as a run artifact.
on:
  push:
    paths:
      - android/**
      - worklet/**
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/android-app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # bare, bare-pack and bare-link, which pack the worklet (android/worklet.mjs).
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" | tail -n 1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # libpeartube.so, the player (android/native).
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native
      # bare-kit built on QuickJS for the phone app and on V8 for the TV receiver (worklet/bare-kit.sh), cached by its inputs.
      - run: npm install --global cmake-runtime@4.3.1 ninja-runtime@1.13.2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/peartube
          key: bare-kit-qjs-${{ hashFiles('worklet/bare-kit.sh', 'worklet/patches/*') }}
      - run: sh worklet/bare-kit.sh arm64-v8a arm64-v8a-v8
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build Phone & TV Receiver APKs
        working-directory: android
        run: ./gradlew --console=plain :app:assembleDebug :tv:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PearTube-debug-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PearTubeReceiver-debug-arm64
          path: android/tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error
