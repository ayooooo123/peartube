[application]
# dx's MainActivity plus the libVLC player.
android_main_activity = "android/MainActivity.kt"

[bundle]
identifier = "com.peartube.app"
publisher = "PearTube"

[android]
# bare-kit's floor. dx's network security config already allows cleartext to
# 127.0.0.1, where the worklet serves streams.
min_sdk = 29
# 3.7.3 and later pull in kotlin-stdlib 2.2; dx builds with Kotlin 2.0.
gradle_dependencies = ["org.videolan.android:libvlc-all:3.7.2"]
proguard_rules = ["android/libvlc.pro"]

[ios]
deployment_target = "16.0"

[ios.plist]
NSLocalNetworkUsageDescription = "PearTube connects directly to peers on your network."

[ios.plist.NSAppTransportSecurity]
NSAllowsLocalNetworking = true
