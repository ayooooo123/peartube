name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for example v1.0.0). Leave empty to build from the current ref.
        required: false
        type: string
      engine:
        description: >-
          JS engine for the BareKit backend runtime. libqjs (QuickJS) keeps the
          native runtime ~50 MB/ABI smaller than V8. Pick "v8" to ship the stock
          engine (escape hatch if a QuickJS regression appears).
        required: false
        default: libqjs
        type: choice
        options: [libqjs, libmqjs, libjsc, libjerry, v8]

permissions:
  contents: write

env:
  # Engine the release APK ships. Tag pushes have no inputs, so they fall back to
  # libqjs — i.e. releases ship QuickJS by default. Set to "v8" to keep stock.
  ENGINE: ${{ github.event.inputs.engine || 'libqjs' }}
  # bare-kit tag the engine is built from — MUST match the react-native-bare-kit
  # version in packages/app/package.json (^0.14.4 → bare-kit v2.2.0).
  BARE_KIT_REF: v2.2.0
  # Fork/ref of `bare` carrying the QuickJS worklet escape-handle fix required for
  # playback under non-V8 engines (proven in commit 3c77f59). Empty = bare-kit's
  # pinned bare (correct once the fix lands upstream).
  BARE_REF: ayooooo123/bare#escape-handle-v1.29.5

jobs:
  build-engine:
    name: Build ${{ github.event.inputs.engine || 'libqjs' }} libbare-kit.so
    # Skipped when shipping stock V8 — react-native-bare-kit already bundles it.
    if: ${{ (github.event.inputs.engine || 'libqjs') != 'v8' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout bare-kit
        uses: actions/checkout@v6
        with:
          repository: holepunchto/bare-kit
          ref: ${{ env.BARE_KIT_REF }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Inject BARE_ENGINE into the Android cmake build
        run: |
          set -euo pipefail
          perl -0pi -e \
            's/("-DANDROID_STL=c\+\+_shared")/$1, "-DBARE_ENGINE=github:holepunchto\/${{ env.ENGINE }}"/g' \
            android/build.gradle
          grep -n "BARE_ENGINE" android/build.gradle

      - name: Repoint bare to the fixed fork (QuickJS playback fix)
        if: ${{ env.BARE_REF != '' }}
        env:
          REF: ${{ env.BARE_REF }}
        run: |
          set -euo pipefail
          echo "Repointing bare -> github:$REF"
          REF="$REF" perl -0pi -e 's{fetch_package\("github:holepunchto/bare\@[0-9.]+"\)}{qq[fetch_package("github:$ENV{REF}")]}ge' CMakeLists.txt
          grep -n "fetch_package.*bare" CMakeLists.txt

      - run: npm install --global cmake-runtime ninja-runtime
      - run: npm install
      - name: Build release AAR
        run: ./gradlew aR --no-daemon

      - name: Extract per-ABI libbare-kit.so
        run: |
          set -euo pipefail
          AAR=$(find android/build/outputs/aar -name '*-release.aar' | head -1)
          echo "AAR: $AAR"
          unzip -o "$AAR" 'jni/*/libbare-kit.so' -d aar-extract
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            SO="aar-extract/jni/$abi/libbare-kit.so"
            if [ -f "$SO" ]; then
              mkdir -p "out/$abi"
              cp "$SO" "out/$abi/libbare-kit.so"
              printf '  %-12s %s\n' "$abi" "$(du -h "$SO" | cut -f1)"
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: bare-kit-engine-${{ env.ENGINE }}
          path: out/**/libbare-kit.so
          if-no-files-found: error
          retention-days: 7

  build-release:
    needs: build-engine
    # Run when the engine built (success) AND when it was skipped for v8.
    # A failed engine build aborts the release rather than silently shipping V8.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate release input and signing config
        id: prep
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            case "$REQUESTED_TAG" in
              v*) ;;
              *)
                echo "::error::workflow_dispatch tag must look like v1.2.3"
                exit 1
                ;;
            esac

            git fetch --force --tags origin
            if ! git rev-parse -q --verify "refs/tags/$REQUESTED_TAG" >/dev/null; then
              echo "::error::Tag '$REQUESTED_TAG' does not exist on origin"
              exit 1
            fi
          fi

          HAS_KEYSTORE=false
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            HAS_KEYSTORE=true
          fi
          echo "has_keystore=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Checkout requested release tag
        if: ${{ github.event.inputs.tag != '' }}
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: git checkout --detach "refs/tags/$REQUESTED_TAG"

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 20.x
          install: 'true'

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - uses: ./.github/actions/prepare-mobile-backend

      - name: Expo prebuild (Android)
        working-directory: packages/app
        run: npm run android:prebuild

      - name: Download custom engine libbare-kit.so
        if: ${{ env.ENGINE != 'v8' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: bare-kit-engine-${{ env.ENGINE }}
          path: packages/app/bare-kit-engine/${{ env.ENGINE }}

      - name: Overlay custom engine onto react-native-bare-kit
        if: ${{ env.ENGINE != 'v8' }}
        run: node packages/app/scripts/apply-bare-kit-engine.mjs --engine ${{ env.ENGINE }}

      - name: Decode release keystore
        if: ${{ steps.prep.outputs.has_keystore == 'true' }}
        working-directory: packages/app/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Configure Gradle release signing
        if: ${{ steps.prep.outputs.has_keystore == 'true' }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/packages/app/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            "android.injected.signing.store.file=$KEYSTORE_PATH" \
            "android.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "android.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "android.injected.signing.key.password=$ANDROID_KEY_PASSWORD" \
            >> "$HOME/.gradle/gradle.properties"

      - name: Configure release Gradle memory
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' \
            'org.gradle.workers.max=2' \
            'kotlin.daemon.jvmargs=-Xmx1536m' \
            >> "$HOME/.gradle/gradle.properties"

      - name: Build release APK (${{ matrix.abi }})
        working-directory: packages/app/android
        env:
          HAS_KEYSTORE: ${{ steps.prep.outputs.has_keystore }}
        run: |
          GRADLE_ARGS=(
            assembleRelease
            "-PtargetAbis=${{ matrix.abi }}"
            "-PreactNativeArchitectures=${{ matrix.abi }}"
            --no-daemon
            --max-workers 2
          )

          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "No Android release keystore secrets configured; using the project's default release signing config."
          fi

          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Rename APK
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          RELEASE_TAG="$REQUESTED_TAG"
          if [ -z "$RELEASE_TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          APK_DIR="packages/app/android/app/build/outputs/apk/release"
          APK_FILE=$(find "$APK_DIR" \( -name "app-${{ matrix.abi }}-release*.apk" -o -name "app-release*.apk" \) | head -1)
          if [ -n "$APK_FILE" ]; then
            mv "$APK_FILE" "$APK_DIR/peartube-${VERSION}-${{ matrix.abi }}.apk"
          else
            echo "::error::No APK found for ABI ${{ matrix.abi }}"
            find "$APK_DIR" -maxdepth 2 -type f -name '*.apk' -print 2>/dev/null || echo "APK directory does not exist"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-${{ matrix.abi }}
          path: packages/app/android/app/build/outputs/apk/release/peartube-*.apk
          retention-days: 30

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '')
    permissions:
      contents: write

    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: apks
          merge-multiple: true

      - name: Verify APK artifacts exist
        shell: bash
        run: |
          mapfile -t apks < <(find apks -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK artifacts were downloaded for release publishing"
            find apks -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          printf 'Publishing %s APK artifact(s):\n' "${#apks[@]}"
          printf ' - %s\n' "${apks[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
