name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for example v1.0.0). Leave empty to build from the current ref.
        required: false
        type: string

permissions:
  contents: write

jobs:
  electrobun-desktop-release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Generate HRPC schema
        run: npm run schema

      - name: Build desktop app
        working-directory: packages/app
        run: |
          npm run desktop:build
          npm run desktop:ebuild

      - name: Package Electrobun desktop release artifact
        working-directory: packages/app
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          RELEASE_TAG="$REQUESTED_TAG"
          if [ -z "$RELEASE_TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            build/dev-macos-arm64/PearTube-dev.app \
            build/PearTube-electrobun-${VERSION}.zip

      - name: Upload Electrobun release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-electrobun-release
          path: packages/app/build/PearTube-electrobun-*.zip
          retention-days: 30
