name: Setup Relay Workspace
description: Set up Node.js and install the backend + relay CLI dependencies used by relay jobs.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22.x'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-workspace
      with:
        node-version: ${{ inputs.node-version }}
        install: 'false'

    - name: Install backend dependencies
      shell: bash
      run: npm install --prefix packages/backend --ignore-scripts

    - name: Install relay dependencies
      shell: bash
      run: npm install --prefix packages/cli --ignore-scripts
