name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

# A newer commit on a PR cancels the older run. Each push to main gets its own group, so every commit gets its
# checks and image: GitHub drops a pending run from a shared group even with cancel-in-progress off.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Every check is its own job, in parallel. timeout-minutes is each job's budget: a job past it fails.
jobs:
  # npm test split over three runners by Node's --test-shard. All files at once on one 4-vCPU runner took 129 s,
  # slower than three at a time (84 s): the runner, not the waiting, was the limit.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: node --test --test-force-exit --test-shard=${{ matrix.shard }}/3 test/*.test.js

  cast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:cast

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Lists contract files changed since native.lock's jsRef: needs history, not file contents, so a blobless clone.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - run: python3 sync-native.py check

  image-build:
    # Builds linux/amd64 and linux/arm64 on native runners (no QEMU: bare-tls's BoringSSL SIGILLs and hangs under qemu-aarch64).
    # Runs beside the checks: it pushes only untagged digests, and `image` tags them once every check passed.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: peartube
          fetch-depth: 0
      - id: meta
        working-directory: peartube
        run: |
          eng=$(node -p 'JSON.parse(fs.readFileSync("./native.lock", "utf8")).engine.relay || "js"')
          commit=$(node -p 'JSON.parse(fs.readFileSync("./native.lock", "utf8")).commit')
          [ "$eng" = "js" ] || python3 sync-native.py check --strict
          echo "engine=$eng" >> "$GITHUB_OUTPUT"
          echo "native_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/peartube-relay" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.meta.outputs.engine == 'rust'
        with:
          repository: ${{ github.repository_owner }}/peartube-native
          ref: ${{ steps.meta.outputs.native_commit }}
          path: stack/peartube-native
      - name: Checkout Rust stack crates at STACK.lock
        if: steps.meta.outputs.engine == 'rust'
        run: |
          while read -r repo sha; do
            git clone --quiet "https://github.com/${{ github.repository_owner }}/$repo.git" "stack/$repo"
            git -C "stack/$repo" checkout --quiet "$sha"
          done < stack/peartube-native/STACK.lock
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.engine == 'rust' && '.' || 'peartube' }}
          file: ${{ steps.meta.outputs.engine == 'rust' && 'stack/peartube-native/relay.Dockerfile' || 'peartube/Dockerfile' }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p digests
          printf '%s\n' "${{ steps.push.outputs.digest }}" > "digests/${{ runner.arch }}.txt"
        working-directory: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ runner.arch }}
          path: digests/*.txt
          if-no-files-found: error
          retention-days: 1

  image:
    # Joins the native amd64 and arm64 digests into the multi-arch :main, :latest, :<engine> and :sha-<commit> tags.
    if: github.event_name == 'push'
    needs: [test, cast, lint, contract, image-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: native.lock
          sparse-checkout-cone-mode: false
      - id: meta
        run: |
          eng=$(node -p 'JSON.parse(fs.readFileSync("./native.lock", "utf8")).engine.relay || "js"')
          echo "engine=$eng" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/peartube-relay" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: digests
        run: |
          sources=""
          for f in *.txt; do
            sources="$sources ${{ steps.meta.outputs.image }}@$(cat "$f")"
          done
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:${{ github.ref_name }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.engine }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            -t "${{ steps.meta.outputs.image }}:sha-${{ github.sha }}" \
            $sources
