<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One seek becomes a byte range</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · playback</p>
    <h1>One seek becomes a byte range, and nothing downloads until it does</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="one-seek-title one-seek-desc">
      <title id="one-seek-title">Playback from URL resolution to bytes on screen</title>
      <desc id="one-seek-desc">Four participants: the video player, the backend playback service, a local blob server, and remote peers. The backend parses a blob reference, asks the blob server for a localhost link, kicks off peer discovery and a playback profile without waiting for either, and hands the player a URL. That URL is the highlighted step. The player then issues HTTP range requests in a loop; each one is translated into a Hypercore block range, fetched sparsely from peers, and returned as partial content.</desc>

      <defs>
        <pattern id="one-seek-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="one-seek-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="one-seek-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
        <marker id="one-seek-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#one-seek-dots)" opacity="0.55"/>

      <!-- Actors -->
      <rect x="40" y="56" width="180" height="44" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="130" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Player</text>
      <text x="130" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thinks it is HTTP</text>

      <rect x="280" y="56" width="180" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="370" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Playback service</text>
      <text x="370" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resolves, never waits</text>

      <rect x="540" y="56" width="180" height="44" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="630" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blob server</text>
      <text x="630" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1 · local only</text>

      <rect x="800" y="56" width="180" height="44" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="890" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Peers</text>
      <text x="890" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Hypercore · sparse</text>

      <!-- Lifelines -->
      <line x1="130" y1="100" x2="130" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="370" y1="100" x2="370" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="630" y1="100" x2="630" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="890" y1="100" x2="890" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="366" y="132" width="8" height="216" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="626" y="404" width="8" height="120" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- 1. resolve -->
      <line x1="134" y1="136" x2="362" y2="136" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-seek-arrow)"/>
      <text x="248" y="128" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">play this video</text>

      <!-- 2. parse (self) -->
      <path d="M 374,164 H 426 V 184 H 378" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-seek-arrow)"/>
      <text x="442" y="170" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">parse the blob ref</text>
      <text x="442" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">64-hex core key + blob id, or throw</text>

      <!-- 3. getLink -->
      <line x1="374" y1="212" x2="622" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-seek-arrow)"/>
      <text x="498" y="204" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">getLink(key, blob, type)</text>

      <!-- 4. return url -->
      <line x1="622" y1="240" x2="374" y2="240" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#one-seek-arrow)"/>
      <text x="498" y="234" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">http://127.0.0.1:port/…</text>

      <!-- 5. join discovery, fire and forget -->
      <line x1="374" y1="272" x2="882" y2="272" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#one-seek-arrow-open)"/>
      <text x="628" y="264" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">join discovery — detached</text>
      <text x="628" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">so peers exist later · no blocks fetched now</text>

      <!-- 6. profile (self) -->
      <path d="M 374,304 H 426 V 324 H 378" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#one-seek-arrow)"/>
      <text x="442" y="310" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">attach playback profile — detached</text>
      <text x="442" y="326" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">keyframe index + moov position</text>

      <!-- 7. URL to player — headline -->
      <line x1="362" y1="356" x2="138" y2="356" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#one-seek-arrow-accent)"/>
      <text x="250" y="350" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the URL, immediately</text>

      <!-- LOOP -->
      <rect x="100" y="384" width="560" height="176" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="100" y="384" width="48" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="124" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="156" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[every seek and every buffer refill]</text>

      <!-- 8. range request -->
      <line x1="134" y1="428" x2="622" y2="428" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-seek-arrow)"/>
      <text x="378" y="420" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">GET · Range: bytes=…</text>

      <!-- 9. want blocks -->
      <line x1="634" y1="460" x2="882" y2="460" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-seek-arrow)"/>
      <text x="758" y="452" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">block range</text>
      <text x="758" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">prioritised · 16 MiB span · 15 s · LRU</text>

      <!-- 10. blocks -->
      <line x1="882" y1="500" x2="634" y2="500" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#one-seek-arrow)"/>
      <text x="758" y="494" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">only those blocks</text>

      <!-- 11. partial content -->
      <line x1="622" y1="536" x2="134" y2="536" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#one-seek-arrow)"/>
      <text x="378" y="530" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">206 Partial Content</text>

      <!-- Captions -->
      <text x="40" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">THE TRICK</text>
      <text x="176" y="632" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The player is an ordinary video element doing ordinary HTTP range requests. A local server translates each range into Hypercore blocks. Nothing in the player knows this is peer-to-peer.</text>
      <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NOTHING PREFETCHES</text>
      <text x="176" y="656" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Steps 5 and 6 are deliberately fire-and-forget: URL resolution must never wait on the network. Discovery only makes peers available; the first byte is fetched when the player asks.</text>
      <text x="40" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHY A PROFILE</text>
      <text x="176" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Knowing where the keyframes and the moov atom sit lets a seek fetch the right blocks first instead of walking the file. Without it a seek is a guess.</text>
    </svg>
  </div>
</body>
</html>
