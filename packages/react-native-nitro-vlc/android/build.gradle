apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def getExtOrDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroVLC_" + name]
}

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroVLC_" + name]).toInteger()
}

android {
    namespace "com.margelo.nitro.com.nitrovlc"
    compileSdk 34

    defaultConfig {
        minSdk 29
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def reactNativeArchs = project.findProperty("reactNativeArchitectures")?.toString()
        if (!reactNativeArchs || reactNativeArchs.trim().isEmpty()) {
            reactNativeArchs = "armeabi-v7a,arm64-v8a"
        }
        ndk {
            abiFilters(*reactNativeArchs.split(',').collect { it.trim() }.findAll { it })
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++20"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            java.srcDirs += [
                "src/main/java",
                "../nitrogen/generated/android/kotlin"
            ]
        }
        test {
            java.srcDirs += ["src/test/java"]
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// Apply Nitrogen autolinking (must be after android block)
apply from: '../nitrogen/generated/android/NitroVLC+autolinking.gradle'

dependencies {
    // React Native
    implementation "com.facebook.react:react-native:+"

    // Nitro Modules (resolved via React Native autolinking, not published to Maven)
    implementation project(":react-native-nitro-modules")

    // VLC
    implementation "org.videolan.android:libvlc-all:3.6.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "org.mockito:mockito-core:5.8.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.2.1"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "io.mockk:mockk:1.13.9"
}
