name: Build bare-mpv prebuilds

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.1)'
        required: false
        default: ''
  push:
    paths:
      - 'packages/bare-mpv/**'
    branches:
      - main

env:
  SKIP_POSTINSTALL: 1

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
            prebuild_dir: darwin-arm64
          - os: macos-15
            arch: x64
            prebuild_dir: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build prerequisites
        run: |
          brew install meson ninja pkg-config nasm

      - name: Install npm dependencies
        working-directory: packages/bare-mpv
        run: npm install

      - name: Build native addon (static mpv from vendor)
        working-directory: packages/bare-mpv
        run: |
          npx bare-make generate
          npx bare-make build
          npx bare-make install

      - name: Verify prebuild was created
        working-directory: packages/bare-mpv
        run: |
          ls -la prebuilds/${{ matrix.prebuild_dir }}/
          file prebuilds/${{ matrix.prebuild_dir }}/bare-mpv.bare

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.prebuild_dir }}
          path: packages/bare-mpv/prebuilds/${{ matrix.prebuild_dir }}/

  build-linux:
    strategy:
      matrix:
        include:
          - arch: x64
            prebuild_dir: linux-x64
            docker_platform: linux/amd64
          - arch: arm64
            prebuild_dir: linux-arm64
            docker_platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (for ARM64 emulation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build in Docker container
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/packages/bare-mpv \
            -e SKIP_POSTINSTALL=1 \
            node:20-bookworm \
            bash -c "
              set -ex
              apt-get update
              apt-get install -y \
                cmake ninja-build pkg-config \
                meson python3-pip \
                nasm \
                clang lld \
                libdrm-dev \
                libasound2-dev \
                libpulse-dev
              
            npm install
            
            npx bare-make generate
              npx bare-make build
              npx bare-make install
              
              ls -la prebuilds/${{ matrix.prebuild_dir }}/
              file prebuilds/${{ matrix.prebuild_dir }}/bare-mpv.bare
            "

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.prebuild_dir }}
          path: packages/bare-mpv/prebuilds/${{ matrix.prebuild_dir }}/

  build-windows:
    strategy:
      matrix:
        include:
          - arch: x64
            prebuild_dir: win32-x64
            msys_arch: MINGW64
            pkg_prefix: mingw-w64-x86_64
          - arch: arm64
            prebuild_dir: win32-arm64
            msys_arch: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys_arch }}
          update: true
          install: >-
            base-devel
            git
            ${{ matrix.pkg_prefix }}-toolchain
            ${{ matrix.pkg_prefix }}-cmake
            ${{ matrix.pkg_prefix }}-ninja
            ${{ matrix.pkg_prefix }}-meson
            ${{ matrix.pkg_prefix }}-pkg-config
            ${{ matrix.pkg_prefix }}-nasm
            ${{ matrix.pkg_prefix }}-python
            ${{ matrix.pkg_prefix }}-clang

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: packages/bare-mpv
        env:
          SKIP_POSTINSTALL: 1
        run: npm install

      - name: Build native addon
        working-directory: packages/bare-mpv
        env:
          SKIP_POSTINSTALL: 1
        run: |
          npx bare-make generate
          npx bare-make build
          npx bare-make install

      - name: Verify prebuild
        working-directory: packages/bare-mpv
        run: |
          Get-ChildItem -Path prebuilds/${{ matrix.prebuild_dir }}/ -Recurse

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.prebuild_dir }}
          path: packages/bare-mpv/prebuilds/${{ matrix.prebuild_dir }}/

  collect-prebuilds:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: packages/bare-mpv/prebuilds/
          pattern: prebuild-*
          merge-multiple: true

      - name: List prebuilds
        run: |
          echo "=== All prebuilds ==="
          find packages/bare-mpv/prebuilds -name "*.bare" -exec ls -lh {} \;
          echo ""
          echo "=== File types ==="
          find packages/bare-mpv/prebuilds -name "*.bare" -exec file {} \;

      - name: Create prebuilds archive
        run: |
          cd packages/bare-mpv
          tar -czvf bare-mpv-prebuilds.tar.gz prebuilds/

      - name: Upload combined prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: bare-mpv-prebuilds-all
          path: packages/bare-mpv/bare-mpv-prebuilds.tar.gz
