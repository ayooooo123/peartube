# PearTube relay container
#
# Quick start:
#   docker compose -f docker-compose.relay.yml up -d
#   docker compose -f docker-compose.relay.yml exec relay /peartube-relay status --json
#
# Archive UI:
#   open http://127.0.0.1:8174
#   docker compose -f docker-compose.relay.yml exec relay /peartube-relay archive --url https://youtu.be/... --run-now

services:
  relay:
    image: ghcr.io/ayooooo123/peartube-relay:latest
    restart: unless-stopped
    ports:
      - "8174:8174"
    environment:
      PEARTUBE_MODE: public
      PEARTUBE_POLICY: discovery
      PEARTUBE_DISCOVERY_ENABLED: "true"
      PEARTUBE_NETWORK_ANNOUNCE: "true"
      # TMDB powers the Discover catalog and auto-classifies archived videos as
      # movies/TV (metadata only). Create a key at
      # https://www.themoviedb.org/settings/api
      PEARTUBE_TMDB_API_KEY: your-tmdb-api-key-here
      PEARTUBE_TMDB_ENABLED: "true"
      PEARTUBE_ARCHIVE_UI_ENABLED: "true"
      PEARTUBE_ARCHIVE_UI_HOST: 0.0.0.0
      PEARTUBE_ARCHIVE_UI_PORT: "8174"
      PEARTUBE_ARCHIVE_TMP_PATH: /var/lib/peartube-relay/archive-tmp
      PEARTUBE_ARCHIVE_FFMPEG_PATH: /usr/local/bin/ffmpeg
      PEARTUBE_ARCHIVE_YT_DLP_EXTRA_ARGS: "--plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=default,-android_vr,mweb;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot"
      PEARTUBE_ARCHIVE_YT_DLP_RETRY_EXTRA_ARGS: "--plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=web_safari;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot || --plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=mweb;player_skip=webpage,configs;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot"
      # Optional but often required by YouTube bot checks. Mount a Netscape-format
      # cookies.txt file at this path before enabling the variable.
      # PEARTUBE_ARCHIVE_COOKIES_PATH: /var/lib/peartube-relay/youtube-cookies.txt
      # Optional S3-compatible relay archive settings:
      # PEARTUBE_ARCHIVE_S3_ENDPOINT: https://s3.example.com
      # PEARTUBE_ARCHIVE_S3_BUCKET: peartube-relay
      # PEARTUBE_ARCHIVE_S3_REGION: us-east-1
      # PEARTUBE_ARCHIVE_S3_ACCESS_KEY_ID: your-access-key
      # PEARTUBE_ARCHIVE_S3_SECRET_ACCESS_KEY: your-secret-key
      # PEARTUBE_ARCHIVE_S3_PREFIX: peartube/
      # PEARTUBE_ARCHIVE_S3_FORCE_PATH_STYLE: "false"
      # Block offload: move media block DATA to the bucket above and keep only
      # the merkle tree and bitfield on disk, so this relay can archive titles
      # larger than its volume. It keeps serving every block it advertises, but
      # the bucket becomes load bearing for playback, so it is off by default.
      # Requires endpoint, bucket and both credentials; a half-configured
      # bucket refuses to start rather than quietly filling the volume.
      # PEARTUBE_ARCHIVE_S3_OFFLOAD: "true"
      # Un-offloaded block data kept on local disk. Default 2 GiB.
      # PEARTUBE_ARCHIVE_S3_OFFLOAD_WINDOW_BYTES: "2147483648"
    volumes:
      - peartube-relay-data:/var/lib/peartube-relay
    command: ["ui", "--host", "0.0.0.0", "--port", "8174"]

volumes:
  peartube-relay-data:
