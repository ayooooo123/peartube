name: Build Desktop

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/backend/**'
      - 'packages/platform/**'
      - 'packages/spec/**'
      - 'packages/bare-*/**'
      - '.github/actions/**'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    paths:
      - 'packages/app/**'
      - 'packages/backend/**'
      - 'packages/platform/**'
      - 'packages/spec/**'
      - 'packages/bare-*/**'
      - '.github/actions/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  electrobun-desktop-build:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Generate HRPC schema
        run: npm run schema

      - name: Build desktop web/export assets
        working-directory: packages/app
        run: npm run desktop:build

      - name: Smoke-test the worker bundle (native addons dlopen)
        working-directory: packages/app
        run: npm run desktop:smoke

      - name: Build Electrobun desktop app
        working-directory: packages/app
        run: npm run desktop:ebuild

      - name: Package Electrobun desktop app artifact
        working-directory: packages/app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/dev-macos-arm64/PearTube-dev.app \
            build/PearTube-electrobun-dev-macos-arm64.zip

      - name: Upload Electrobun desktop app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-electrobun-desktop
          path: packages/app/build/PearTube-electrobun-dev-macos-arm64.zip
          retention-days: 7
