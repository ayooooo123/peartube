[package]
name = "peartube"
version = "0.4.5"
edition = "2024"
publish = false

# dx takes the app's display name from the binary name.
[[bin]]
name = "PearTube"
path = "src/main.rs"

[dependencies]
dioxus = { version = "=0.7.10", features = [] }
futures-channel = "0.3"
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# In-app video through VLC.app's libVLC, drawn in a native view.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry"] }

[dev-dependencies]
futures-executor = "0.3"
sha2 = "0.10"
ureq = { version = "3", default-features = false }

[build-dependencies]
serde_json = "1"

[features]
default = ["mobile"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
