name: Fast CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/backend/**'
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/host/**'
      - 'packages/platform/**'
      - 'packages/spec/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/backend/**'
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/host/**'
      - 'packages/platform/**'
      - 'packages/spec/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Run changed-file linter
        run: npm run lint:changed

      - name: Test ast-grep rules
        run: npm run lint:ast:test

      - name: Scan AST regressions
        run: npm run lint:ast

      - name: Run targeted oxlint
        run: npm run lint:oxlint

      # Whole-repo, not just the diff. `lint:changed` cannot see a file that a
      # sibling change broke, and this ratchets at the measured baseline so
      # existing debt stays visible without blocking.
      - name: Run repository eslint
        run: npm run lint:eslint

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - name: Run backend tests
        run: npm test --prefix packages/backend

  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      # The schema, the protocol client and the runner facade are the contract
      # every client speaks. They ran nowhere before.
      - name: Run spec tests
        run: npm test --prefix packages/spec

      - name: Run host tests
        run: npm test --prefix packages/host

      - name: Run platform tests
        run: npm test --prefix packages/platform

      - name: Run platform typecheck
        run: npm run typecheck --prefix packages/platform

  app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      # Must run from the package: the render tests alias `react-native` to
      # `react-native-web`, and esbuild resolves an alias target against the
      # working directory, not the importing file.
      - name: Run app tests
        run: node --test --test-concurrency=4 tests/*.test.mjs
        working-directory: packages/app

      # The app pins TypeScript 5.9 through the Expo toolchain; the root pins
      # 6.0. Resolving `tsc` from the root would typecheck against a compiler
      # the app is never built with.
      - name: Run app typecheck
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json
        working-directory: packages/app
