pluginManagement {
  def resolveNodeExecutable = {
    def configured = providers.gradleProperty("nodeExecutable").orNull ?: System.getenv("NODE_BINARY")
    if (configured != null && configured.toString().trim()) return configured.toString()

    def pathEnv = System.getenv("PATH") ?: ""
    for (def entry : pathEnv.split(File.pathSeparator)) {
      if (!entry) continue
      def candidate = new File(entry, "node")
      if (candidate.canExecute()) return candidate.absolutePath
    }

    for (def candidatePath : ["/opt/homebrew/bin/node", "/usr/local/bin/node", "/usr/bin/node"]) {
      def candidate = new File(candidatePath)
      if (candidate.canExecute()) return candidate.absolutePath
    }

    throw new GradleException("Node.js executable was not found. Set NODE_BINARY or -PnodeExecutable to an absolute node path.")
  }
  def nodeExecutable = resolveNodeExecutable()

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExecutable, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExecutable, "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'PearTube'

expoAutolinking.useExpoVersionCatalog()

include ':app'
// PearTube: compile patched expo-video Android sources.
include ':expo-video'
project(':expo-video').projectDir = new File(rootProject.projectDir, '../node_modules/expo-video/android')
includeBuild(expoAutolinking.reactNativeGradlePlugin)
