<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One video, end to end</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1400px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1100px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · PearTube</p>
    <h1>One video, from a file on your phone to playing on a stranger's</h1>

    <svg viewBox="0 0 1400 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="one-video-title one-video-desc">
      <title id="one-video-title">One video from upload to playback</title>
      <desc id="one-video-desc">Eleven sequential steps across four lanes. The uploading device picks and transcodes a file. Storage writes it to Hyperblobs and records a row in the channel database. The uploader signs a manifest, the network announces a catalog page and a viewer discovers it. The viewer then requests a block, which is the highlighted step, the network replicates it sparsely, a local blob server hands the player a URL, and playback begins.</desc>

      <defs>
        <pattern id="one-video-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="one-video-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="one-video-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#one-video-dots)" opacity="0.55"/>

      <!-- Lane tints (odd-indexed) -->
      <rect x="140" y="36" width="1260" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="140" y="196" width="1260" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Lane dividers -->
      <line x1="0" y1="36" x2="1400" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="1400" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="1400" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="1400" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="356" x2="1400" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

      <!-- Step header chips + labels -->
      <rect x="190" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="198" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text><text x="198" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">PICK</text>
      <rect x="302" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="310" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">2</text><text x="310" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">TRANSCODE</text>
      <rect x="414" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="422" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">3</text><text x="422" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">STORE</text>
      <rect x="526" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="534" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">4</text><text x="534" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">RECORD</text>
      <rect x="638" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="646" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">5</text><text x="646" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">SIGN</text>
      <rect x="750" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="758" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">6</text><text x="758" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">ANNOUNCE</text>

      <rect x="974" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,0.20)"/><text x="982" y="19" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">8</text><text x="982" y="32" fill="#eb6c36" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">REQUEST</text>
      <rect x="1086" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="1094" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">9</text><text x="1094" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">REPLICATE</text>
      <rect x="1196" y="8" width="20" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="1206" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">10</text><text x="1206" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">SERVE</text>
      <rect x="1308" y="8" width="20" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="1318" y="19" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">11</text><text x="1318" y="32" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500" letter-spacing="0.12em">PLAY</text>

      <!-- Lane labels -->
      <text x="70" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPLOADER</text>

      <text x="70" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NETWORK</text>
      <text x="70" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEWER</text>

      <!-- Connectors (before nodes) -->
      <line x1="248" y1="76" x2="260" y2="76" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-video-arrow)"/>
      <path d="M 360,76 H 414 Q 422,76 422,84 V 124" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-video-arrow)"/>
      <line x1="472" y1="156" x2="484" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-video-arrow)"/>
      <path d="M 584,156 H 638 Q 646,156 646,148 V 108" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-video-arrow)"/>
      <path d="M 696,76 H 750 Q 758,76 758,84 V 204" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-video-arrow)"/>
      <line x1="808" y1="236" x2="820" y2="236" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-video-arrow)"/>
      <path d="M 920,236 H 974 Q 982,236 982,244 V 284" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#one-video-arrow-accent)"/>
      <path d="M 1032,316 H 1086 Q 1094,316 1094,308 V 268" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#one-video-arrow-accent)"/>
      <path d="M 1144,236 H 1198 Q 1206,236 1206,244 V 284" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-video-arrow)"/>
      <line x1="1256" y1="316" x2="1268" y2="316" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-video-arrow)"/>

      <!-- UPLOADER nodes -->
      <rect x="148" y="44" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="152" y="48" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="159" y="56" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">UPL</text>
      <text x="198" y="70" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pick a file</text>
      <text x="198" y="84" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">mp4 on disk</text>
      <text x="198" y="96" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">upload.js</text>

      <rect x="260" y="44" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="264" y="48" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="271" y="56" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">UPL</text>
      <text x="310" y="70" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transcode</text>
      <text x="310" y="84" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">renditions</text>
      <text x="310" y="96" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">bare-ffmpeg</text>

      <rect x="596" y="44" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="600" y="48" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="607" y="56" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">UPL</text>
      <text x="646" y="70" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sign manifest</text>
      <text x="646" y="84" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">attestation</text>
      <text x="646" y="96" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">IdentityKey</text>

      <!-- STORAGE nodes -->
      <rect x="372" y="124" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="376" y="128" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="383" y="136" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">STO</text>
      <text x="422" y="150" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write blob</text>
      <text x="422" y="164" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">blob id + blocks</text>
      <text x="422" y="176" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Hyperblobs</text>

      <rect x="484" y="124" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="488" y="128" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="495" y="136" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">STO</text>
      <text x="534" y="150" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record row</text>
      <text x="534" y="164" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">video entry</text>
      <text x="534" y="176" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">HyperDB</text>

      <!-- NETWORK nodes -->
      <rect x="708" y="204" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="712" y="208" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="719" y="216" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">NET</text>
      <text x="758" y="230" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Announce</text>
      <text x="758" y="244" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">catalog page</text>
      <text x="758" y="256" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">DHT topic</text>

      <rect x="820" y="204" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="824" y="208" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="831" y="216" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">NET</text>
      <text x="870" y="230" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Discover</text>
      <text x="870" y="244" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">verify signature</text>
      <text x="870" y="256" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Hyperswarm</text>

      <rect x="1044" y="204" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="1048" y="208" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="1055" y="216" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">NET</text>
      <text x="1094" y="230" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Send blocks</text>
      <text x="1094" y="244" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">sparse · only asked</text>
      <text x="1094" y="256" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">Hypercore</text>

      <!-- VIEWER nodes -->
      <rect x="932" y="284" width="100" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="936" y="288" width="14" height="10" rx="2" fill="rgba(235,108,54,0.18)"/><text x="943" y="296" fill="#eb6c36" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">VWR</text>
      <text x="982" y="310" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ask for a block</text>
      <text x="982" y="324" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">asset-block-request</text>
      <text x="982" y="336" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">peer frame</text>

      <rect x="1156" y="284" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="1160" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="1167" y="296" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">VWR</text>
      <text x="1206" y="310" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Serve locally</text>
      <text x="1206" y="324" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">localhost URL</text>
      <text x="1206" y="336" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">blob-server</text>

      <rect x="1268" y="284" width="100" height="64" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="1272" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/><text x="1279" y="296" fill="#2d3142" font-size="6" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">VWR</text>
      <text x="1318" y="310" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Play</text>
      <text x="1318" y="324" fill="#4f5d75" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">seek = new range</text>
      <text x="1318" y="336" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace" text-anchor="middle">player</text>

      <!-- Legend -->
      <text x="24" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STEP 8</text>
      <text x="140" y="372" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">This is the only step that is PearTube's own invention. Everything else is a Holepunch primitive doing its job. A "peer frame" is just the envelope this request travels in.</text>
      <text x="24" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NOTHING PUSHES</text>
      <text x="140" y="393" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The uploader never sends the video anywhere. It announces that the video exists; viewers pull the blocks they need, when they need them. That is why step 9 says "only asked".</text>
      <text x="24" y="414" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHERE IT LOOPS</text>
      <text x="140" y="414" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Steps 8 to 11 repeat for every seek and every buffer refill. Steps 1 to 7 happen once, when the video is published.</text>
    </svg>
  </div>
</body>
</html>
