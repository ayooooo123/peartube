name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          npm ci
          cd packages/backend && npm ci && cd ../..
          cd packages/app && npm ci --legacy-peer-deps && cd ../..

      - name: Bundle backend
        working-directory: packages/app
        run: npm run bundle:backend

      - name: Expo prebuild (Android)
        working-directory: packages/app
        run: npm run android:prebuild

      - name: Build debug APK
        working-directory: packages/app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: peartube-debug-apks
          path: packages/app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
