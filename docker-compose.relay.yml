# PearTube relay container examples
#
# Public relay quick start:
#   docker compose -f docker-compose.relay.yml up -d
#   docker compose -f docker-compose.relay.yml exec peartube-public-relay /peartube-relay status --json
#
# Curated public relay:
#   docker compose -f docker-compose.relay.yml --profile curated up -d
#
# Archive publisher relay:
#   docker compose -f docker-compose.relay.yml --profile archive-publisher up -d
#
# Archive UI for the default public relay:
#   open http://127.0.0.1:8174
#   docker compose -f docker-compose.relay.yml exec peartube-public-relay /peartube-relay archive --url https://youtu.be/... --run-now

services:
  peartube-public-relay:
    image: ghcr.io/ayooooo123/peartube-relay:latest
    restart: unless-stopped
    ports:
      - "8174:8174"
    environment:
      PEARTUBE_NODE_ROLES: public-index,relay-cache
      PEARTUBE_MODE: public
      PEARTUBE_POLICY: discovery
      PEARTUBE_MODERATION_MODE: report-and-alert
      PEARTUBE_DISCOVERY_ENABLED: "true"
      PEARTUBE_NETWORK_ANNOUNCE: "true"
      PEARTUBE_ARCHIVE_UI_ENABLED: "true"
      PEARTUBE_ARCHIVE_UI_HOST: 0.0.0.0
      PEARTUBE_ARCHIVE_UI_PORT: "8174"
      PEARTUBE_ARCHIVE_TMP_PATH: /var/lib/peartube-relay/archive-tmp
      PEARTUBE_ARCHIVE_FFMPEG_PATH: /usr/local/bin/ffmpeg
      PEARTUBE_ARCHIVE_YT_DLP_EXTRA_ARGS: "--plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=default,-android_vr,mweb;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot"
      PEARTUBE_ARCHIVE_YT_DLP_RETRY_EXTRA_ARGS: "--plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=web_safari;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot || --plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=mweb;player_skip=webpage,configs;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot"
      # Optional but often required by YouTube bot checks. Mount a Netscape-format
      # cookies.txt file at this path before enabling the variable.
      # PEARTUBE_ARCHIVE_COOKIES_PATH: /var/lib/peartube-relay/youtube-cookies.txt
    volumes:
      - peartube-relay-data:/var/lib/peartube-relay
    command: ["ui", "--host", "0.0.0.0", "--port", "8174"]

  peartube-curated-relay:
    image: ghcr.io/ayooooo123/peartube-relay:latest
    profiles: ["curated"]
    restart: unless-stopped
    ports:
      - "8175:8174"
    environment:
      PEARTUBE_NODE_ROLES: public-index,relay-cache
      PEARTUBE_MODE: public
      PEARTUBE_POLICY: allowlist
      PEARTUBE_MODERATION_MODE: enforce
      PEARTUBE_DISCOVERY_ENABLED: "true"
      PEARTUBE_NETWORK_ANNOUNCE: "true"
      PEARTUBE_ARCHIVE_UI_ENABLED: "true"
      PEARTUBE_ARCHIVE_UI_HOST: 0.0.0.0
      PEARTUBE_ARCHIVE_UI_PORT: "8174"
      # Fill these before running the curated profile.
      PEARTUBE_ADMISSION_CHANNELS: channelKey1,channelKey2
      PEARTUBE_ADMISSION_OWNERS: ownerKey1
    volumes:
      - peartube-curated-relay-data:/var/lib/peartube-relay
    command: ["ui", "--host", "0.0.0.0", "--port", "8174"]

  peartube-archive-publisher:
    image: ghcr.io/ayooooo123/peartube-relay:latest
    profiles: ["archive-publisher"]
    restart: unless-stopped
    ports:
      - "8176:8174"
    environment:
      PEARTUBE_NODE_ROLES: archiver,public-index,relay-cache
      PEARTUBE_MODE: public
      PEARTUBE_POLICY: discovery
      PEARTUBE_MODERATION_MODE: report-and-alert
      PEARTUBE_DISCOVERY_ENABLED: "true"
      PEARTUBE_NETWORK_ANNOUNCE: "true"
      PEARTUBE_ARCHIVE_ENABLED: "true"
      PEARTUBE_ARCHIVE_SOURCES: https://www.youtube.com/@example
      PEARTUBE_ARCHIVE_UI_ENABLED: "true"
      PEARTUBE_ARCHIVE_UI_HOST: 0.0.0.0
      PEARTUBE_ARCHIVE_UI_PORT: "8174"
      PEARTUBE_ARCHIVE_TMP_PATH: /var/lib/peartube-relay/archive-tmp
      PEARTUBE_ARCHIVE_FFMPEG_PATH: /usr/local/bin/ffmpeg
      PEARTUBE_ARCHIVE_YT_DLP_EXTRA_ARGS: "--plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=default,-android_vr,mweb;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot"
      PEARTUBE_ARCHIVE_YT_DLP_RETRY_EXTRA_ARGS: "--plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=web_safari;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot || --plugin-dirs /usr/local/share/yt-dlp-plugins --extractor-args youtube:player_client=mweb;player_skip=webpage,configs;youtubepot-bgutilcli:cli_path=/usr/local/bin/bgutil-pot"
      # Optional but often required by YouTube bot checks. Mount a Netscape-format
      # cookies.txt file at this path before enabling the variable.
      # PEARTUBE_ARCHIVE_COOKIES_PATH: /var/lib/peartube-relay/youtube-cookies.txt
    volumes:
      - peartube-archive-publisher-data:/var/lib/peartube-relay
    command: ["ui", "--host", "0.0.0.0", "--port", "8174"]

volumes:
  peartube-relay-data:
  peartube-curated-relay-data:
  peartube-archive-publisher-data:
