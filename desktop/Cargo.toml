# The Mac app: a GPUI window over the P2P engine and the Rust player. The
# version is package.json's; this crate has none of its own.
[package]
name = "peartube"
edition = "2024"
publish = false

[features]
# Runs the P2P engine in-process from the pinned peartube-native library
# (sync-native.py fetches it) instead of the Bare worklet and bare-kit.
# desktop/bundle.sh --engine rust turns this on.
engine-rust = []

[[bin]]
name = "PearTube"
path = "src/main.rs"


[[bin]]
name = "PearTubeReceiver"
path = "src/receiver_main.rs"
[dependencies]
# GPUI (Zed's UI framework, the gpui-pre snapshot), its macOS platform, and
# gpui-component's widgets: text inputs, slider, menus. Pinned exactly: GPUI
# changes its API between snapshots.
gpui-kit = "=0.7.3"
futures-channel = "0.3"
# GPUI ships no HTTP client of its own; this one fetches artwork (and follows redirects).
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The video player: peartube-media's engine, OxideAV codecs and the
# platform video decoders. See [patch.crates-io] below.
player = { git = "https://github.com/ayooooo123/peartube-media", rev = "22d10cb86b39720547db56ed4a5eec383ce71018" }
codecs = { git = "https://github.com/ayooooo123/peartube-media", rev = "22d10cb86b39720547db56ed4a5eec383ce71018" }
oxideav-core = "*"

[dev-dependencies]
futures-executor = "0.3"
sha2 = "0.10"
ureq = { version = "3", default-features = false }

[build-dependencies]
serde_json = "1"

# Optimised for speed, not size: everything at opt-level 3. Unwinding stays
# on: the player catches decoder panics.
[profile.release]
strip = true

# Video decoding unoptimized is too slow to watch; keep the app's own code
# quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

