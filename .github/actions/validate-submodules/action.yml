name: Validate Submodules
description: Verify the expected submodules are present and initialize them for CI builds.

runs:
  using: composite
  steps:
    - name: Validate and init required submodules
      shell: bash
      run: |
        SUBMODULE_PATHS=$(git ls-files --stage | awk '$1 == "160000" {print $4}')
        if [ -z "$SUBMODULE_PATHS" ]; then
          echo "::error::No git submodules found in the checked-out tree"
          exit 1
        fi

        for path in $SUBMODULE_PATHS; do
          case "$path" in
            packages/bare-ffmpeg)
              expected="https://github.com/ayooooo123/bare-ffmpeg.git"
              ;;
            packages/bare-mpv)
              expected="https://github.com/ayooooo123/bare-mpv.git"
              ;;
            *)
              echo "::error::Unexpected git submodule path in repository tree: $path"
              exit 1
              ;;
          esac

          actual=$(git config -f .gitmodules --get "submodule.$path.url" || true)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected submodule URL for $path: $actual"
            exit 1
          fi
        done

        git submodule sync -- $SUBMODULE_PATHS
        git submodule update --init --depth 1 -- $SUBMODULE_PATHS
