name: Setup Node Workspace
description: Set up Node.js and optionally install the repo workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22.x'
  install:
    description: Whether to run the repo install flow.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install workspace dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if npm run install:all; then
            exit 0
          fi

          if [ "$attempt" -eq 3 ]; then
            echo "::error::npm run install:all failed after 3 attempts"
            exit 1
          fi

          echo "npm run install:all failed; retrying in $((attempt * 20)) seconds..."
          npm cache verify || true
          sleep $((attempt * 20))
        done
