name: Build Mobile

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/backend/**'
      - 'packages/platform/**'
      - 'packages/spec/**'
      - 'packages/bare-*/**'
      - '.github/actions/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 20.x
          install: 'true'

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - uses: ./.github/actions/prepare-mobile-backend

      - name: Expo prebuild (Android)
        working-directory: packages/app
        run: npm run android:prebuild

      - name: Build debug APK
        working-directory: packages/app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-android-debug
          path: packages/app/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

  android-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 20.x
          install: 'true'

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - uses: ./.github/actions/prepare-mobile-backend

      - name: Expo prebuild (Android)
        working-directory: packages/app
        run: npm run android:prebuild

      - name: Build release APK and AAB
        working-directory: packages/app/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-android-release-artifacts
          path: |
            packages/app/android/app/build/outputs/apk/release/*.apk
            packages/app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  ios-build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/validate-submodules

      - uses: ./.github/actions/setup-node-workspace
        with:
          node-version: 22.x
          install: 'true'

      - uses: ./.github/actions/prepare-mobile-backend

      - name: Prepare iOS frameworks
        working-directory: packages/app
        shell: bash
        run: npm run ios:prepare

      - name: Install CocoaPods dependencies
        working-directory: packages/app
        run: npx pod-install

      - name: Build iOS simulator app
        working-directory: packages/app/ios
        run: |
          xcodebuild \
            -workspace PearTube.xcworkspace \
            -scheme PearTube \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: peartube-ios-simulator-app
          path: packages/app/ios/build/Build/Products/Debug-iphonesimulator/PearTube.app
          retention-days: 7
