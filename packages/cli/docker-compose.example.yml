services:
  peartube-public-relay:
    image: ghcr.io/ayooooo123/peartube-relay:latest
    pull_policy: always
    restart: unless-stopped
    # Shell-less runtime image. Inspect with:
    # docker exec <container> /peartube-relay status --json
    ports:
      - "8174:8174"
    environment:
      PEARTUBE_NODE_ROLES: public-index,relay-cache
      PEARTUBE_MODE: public
      PEARTUBE_POLICY: discovery
      PEARTUBE_MODERATION_MODE: report-and-alert
      PEARTUBE_STORAGE_PATH: /var/lib/peartube-relay
      PEARTUBE_STORAGE_MAX_BYTES: 107374182400
      PEARTUBE_DISCOVERY_ENABLED: "true"
      PEARTUBE_DISCOVERY_MAX_CHANNELS: 500
      PEARTUBE_DISCOVERY_MAX_CHANNELS_PER_OWNER: 20
      PEARTUBE_NETWORK_ANNOUNCE: "true"
      PEARTUBE_NETWORK_BOOTSTRAP: default
      PEARTUBE_ARCHIVE_UI_ENABLED: "true"
      PEARTUBE_ARCHIVE_UI_HOST: 0.0.0.0
      PEARTUBE_ARCHIVE_UI_PORT: "8174"
      PEARTUBE_LOG_LEVEL: info
    volumes:
      - peartube-relay-data:/var/lib/peartube-relay
    command: ["ui", "--host", "0.0.0.0", "--port", "8174"]

  peartube-curated-relay:
    image: ghcr.io/ayooooo123/peartube-relay:latest
    profiles: ["curated"]
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8175:8174"
    environment:
      PEARTUBE_NODE_ROLES: public-index,relay-cache
      PEARTUBE_MODE: public
      PEARTUBE_POLICY: allowlist
      PEARTUBE_MODERATION_MODE: enforce
      PEARTUBE_STORAGE_PATH: /var/lib/peartube-relay
      PEARTUBE_STORAGE_MAX_BYTES: 107374182400
      PEARTUBE_DISCOVERY_ENABLED: "true"
      PEARTUBE_DISCOVERY_MAX_CHANNELS: 500
      PEARTUBE_DISCOVERY_MAX_CHANNELS_PER_OWNER: 20
      PEARTUBE_NETWORK_ANNOUNCE: "true"
      PEARTUBE_NETWORK_BOOTSTRAP: default
      PEARTUBE_ARCHIVE_UI_ENABLED: "true"
      PEARTUBE_ARCHIVE_UI_HOST: 0.0.0.0
      PEARTUBE_ARCHIVE_UI_PORT: "8174"
      # Fill these before running the curated profile.
      PEARTUBE_ADMISSION_CHANNELS: channelKey1,channelKey2
      PEARTUBE_ADMISSION_OWNERS: ownerKey1
      PEARTUBE_LOG_LEVEL: info
    volumes:
      - peartube-curated-relay-data:/var/lib/peartube-relay
    command: ["ui", "--host", "0.0.0.0", "--port", "8174"]

  peartube-archive-publisher:
    image: ghcr.io/ayooooo123/peartube-relay:latest
    profiles: ["archive-publisher"]
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8176:8174"
    environment:
      PEARTUBE_NODE_ROLES: archiver,public-index,relay-cache
      PEARTUBE_MODE: public
      PEARTUBE_POLICY: discovery
      PEARTUBE_MODERATION_MODE: report-and-alert
      PEARTUBE_STORAGE_PATH: /var/lib/peartube-relay
      PEARTUBE_STORAGE_MAX_BYTES: 107374182400
      PEARTUBE_DISCOVERY_ENABLED: "true"
      PEARTUBE_DISCOVERY_MAX_CHANNELS: 500
      PEARTUBE_DISCOVERY_MAX_CHANNELS_PER_OWNER: 20
      PEARTUBE_NETWORK_ANNOUNCE: "true"
      PEARTUBE_NETWORK_BOOTSTRAP: default
      PEARTUBE_ARCHIVE_ENABLED: "true"
      PEARTUBE_ARCHIVE_SOURCES: https://www.youtube.com/@example
      PEARTUBE_ARCHIVE_UI_ENABLED: "true"
      PEARTUBE_ARCHIVE_UI_HOST: 0.0.0.0
      PEARTUBE_ARCHIVE_UI_PORT: "8174"
      PEARTUBE_ARCHIVE_TMP_PATH: /var/lib/peartube-relay/archive-tmp
      PEARTUBE_ARCHIVE_FFMPEG_PATH: /usr/local/bin/ffmpeg
      PEARTUBE_LOG_LEVEL: info
    volumes:
      - peartube-archive-publisher-data:/var/lib/peartube-relay
    command: ["ui", "--host", "0.0.0.0", "--port", "8174"]

volumes:
  peartube-relay-data:
  peartube-curated-relay-data:
  peartube-archive-publisher-data:
