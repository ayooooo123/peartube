<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PearTube · one contract, four shells</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · PearTube</p>
    <h1>Four shells, one wire contract, one Holepunch backend</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">PearTube architecture</title>
      <desc id="architecture-desc">Four client shells — iOS and Android, an Electrobun desktop app, and a CLI relay — all speak one generated HRPC contract, highlighted as the focal component. Below it sit four Holepunch storage primitives: Corestore, HyperDB, Hyperblobs and Autobase. All four replicate over a single transport layer of Hyperswarm, HyperDHT and Protomux.</desc>

      <defs>
        <pattern id="architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#architecture-dots)" opacity="0.55"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <rect x="188" y="56" width="624" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="452" y="60" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="69" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT SHELLS</text>

      <rect x="80" y="312" width="820" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="444" y="316" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="325" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STORAGE PRIMITIVES</text>

      <rect x="80" y="456" width="820" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="464" y="460" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="469" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TRANSPORT</text>

      <!-- Arrows: shells -> contract -->
      <line x1="300" y1="144" x2="300" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <line x1="500" y1="144" x2="500" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <line x1="700" y1="144" x2="700" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

      <!-- Arrows: contract -> stores (vertical drop, horizontal bus, vertical into each) -->
      <line x1="500" y1="272" x2="500" y2="300" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="190" y1="300" x2="790" y2="300" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="190" y1="300" x2="190" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <line x1="390" y1="300" x2="390" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <line x1="590" y1="300" x2="590" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <line x1="790" y1="300" x2="790" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

      <!-- Arrows: stores -> transport -->
      <line x1="190" y1="400" x2="190" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
      <line x1="390" y1="400" x2="390" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
      <line x1="590" y1="400" x2="590" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
      <line x1="790" y1="400" x2="790" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

      <!-- Shell nodes -->
      <rect x="214" y="88" width="172" height="56" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="300" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iOS · Android</text>
      <text x="300" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Expo RN · BareKit</text>

      <rect x="414" y="88" width="172" height="56" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="500" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Desktop</text>
      <text x="500" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Electrobun · macOS</text>

      <rect x="614" y="88" width="172" height="56" rx="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="700" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Relay CLI</text>
      <text x="700" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Bare · Linux · Docker</text>

      <!-- Contract node (FOCAL) -->
      <rect x="180" y="200" width="640" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="228" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generated wire contract</text>
      <text x="500" y="246" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hyperschema + HRPC · one 2,700-line source</text>
      <text x="500" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">35,290 generated lines · JS and Swift, byte-compatible</text>

      <!-- Store nodes -->
      <rect x="104" y="336" width="172" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="190" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Corestore</text>
      <text x="190" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core lifecycle</text>

      <rect x="304" y="336" width="172" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="390" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HyperDB</text>
      <text x="390" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">channels · single-writer</text>

      <rect x="504" y="336" width="172" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="590" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hyperblobs</text>
      <text x="590" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">media · sparse ranges</text>

      <rect x="704" y="336" width="172" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="790" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Autobase</text>
      <text x="790" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">personal store only</text>

      <!-- Transport node -->
      <rect x="104" y="480" width="772" height="56" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="490" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hyperswarm · HyperDHT · Protomux</text>
      <text x="490" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Noise · five versioned peer protocols on compact-encoding</text>

      <!-- Caption -->
      <text x="80" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL</text>
      <text x="168" y="584" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The contract is the load-bearing idea: three client shells and a relay stay wire-compatible because none of them hand-writes the wire format.</text>
      <text x="80" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HONEST NOTE</text>
      <text x="168" y="604" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Channels are single-writer despite the module name; Autobase backs only the personal store. See CLEANUP_PLAN.md.</text>
    </svg>
  </div>
</body>
</html>
