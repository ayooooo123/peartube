    async function stop () {
      await mirrorHost?.close().catch(() => {})
      await mirrorStarting
      const { node, acquirer, cast } = state
      state.node = state.acquirer = state.cast = state.mirror = null
      mirrorHost = null
      await cast?.close().catch(() => {})
      acquirer?.close()
      try {
        await node?.close()
      } catch (err) {
        closeFailure = Object.assign(new Error(`The node did not close: ${reasonOf(err)}.`), { status: 500 })
      }
      api.notify('update')
      if (closeFailure) throw closeFailure
    }
