name: Release

# Choose which P2P engine(s) to ship on release:
#   - Tag `vX.Y.Z` (or dispatch `engine: lock`): ships each surface's default engine in `native.lock`
#     (`python3 sync-native.py engine js|rust [surface...]` flips defaults before tagging).
#   - Tag `vX.Y.Z-rust` / dispatch `engine: rust`: ships only the native Rust engine across all surfaces.
#   - Tag `vX.Y.Z-js`   / dispatch `engine: js`:   ships only the Bare JS engine across all surfaces.
#   - Tag `vX.Y.Z-both` / dispatch `engine: both`: ships both JS and Rust variants side by side in one release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to ship in this release
        type: choice
        options: [lock, rust, js, both]
        default: lock
      tag:
        description: Existing tag to publish a GitHub Release onto (leave empty for artifact-only build)
        required: false

permissions:
  contents: write
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.p.outputs.desktop }}
      android_app: ${{ steps.p.outputs.android_app }}
      android_tv: ${{ steps.p.outputs.android_tv }}
      relay: ${{ steps.p.outputs.relay }}
      any_rust: ${{ steps.p.outputs.any_rust }}
      release_tag: ${{ steps.p.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: p
        run: |
          ref_tag=""
          case "${{ github.ref }}" in refs/tags/v*) ref_tag="${{ github.ref_name }}" ;; esac
          tag="${{ github.event.inputs.tag || '' }}"
          [ -n "$tag" ] || tag="$ref_tag"

          mode="${{ github.event.inputs.engine || '' }}"
          if [ -z "$mode" ]; then
            case "$tag" in
              *-rust) mode="rust" ;;
              *-js)   mode="js" ;;
              *-both) mode="both" ;;
              *)      mode="lock" ;;
            esac
          fi

          pick () {
            if [ "$mode" = "lock" ]; then
              node -p "JSON.parse(fs.readFileSync('./native.lock', 'utf8')).engine['$1'] || 'js'"
            else
              echo "$mode"
            fi
          }
          d=$(pick desktop)
          aa=$(pick android-app)
          at=$(pick android-tv)
          r=$(pick relay)
          any_rust=false
          for v in "$d" "$aa" "$at" "$r"; do
            case "$v" in rust|both) any_rust=true ;; esac
          done
          [ "$any_rust" = "false" ] || python3 sync-native.py check --strict

          echo "desktop=$d" >> "$GITHUB_OUTPUT"
          echo "android_app=$aa" >> "$GITHUB_OUTPUT"
          echo "android_tv=$at" >> "$GITHUB_OUTPUT"
          echo "relay=$r" >> "$GITHUB_OUTPUT"
          echo "any_rust=$any_rust" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release plan (mode=$mode, tag=${tag:-none}): desktop=$d android-app=$aa android-tv=$at relay=$r"

  macos:
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop\nweb"
      - run: npm ci
      - if: needs.plan.outputs.desktop == 'js' || needs.plan.outputs.desktop == 'both'
        run: sh worklet/bare-kit.sh darwin
      - name: Bundle macOS Desktop & Receiver (${{ needs.plan.outputs.desktop }})
        run: |
          sh desktop/bundle.sh --engine "${{ needs.plan.outputs.desktop }}" --zip
          sh desktop/bundle.sh --receiver --engine "${{ needs.plan.outputs.desktop }}" --zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: desktop/target/release/*-macos-*.zip
          if-no-files-found: error

  android:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" | tail -n 1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native
      - run: npm install --global cmake-runtime@4.3.1 ninja-runtime@1.13.2
      - if: needs.plan.outputs.android_app != 'rust' || needs.plan.outputs.android_tv != 'rust'
        run: sh worklet/bare-kit.sh arm64-v8a arm64-v8a-v8
      - name: Build Android Phone & TV APKs (app=${{ needs.plan.outputs.android_app }}, tv=${{ needs.plan.outputs.android_tv }})
        id: apk
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.PEARTUBE_ANDROID_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.PEARTUBE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PEARTUBE_ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.PEARTUBE_ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          ver=$(node -p 'require("../package.json").version')
          mkdir -p ../dist-android
          has_key=false
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ]; then
            has_key=true
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            mkdir -p "$HOME/.gradle"
            umask 077
            {
              printf 'peartube.keystore=%s\n' "$RUNNER_TEMP/release.jks"
              printf 'peartube.keystorePassword=%s\n' "$STORE_PW"
              printf 'peartube.keyAlias=%s\n' "$KEY_ALIAS"
              printf 'peartube.keyPassword=%s\n' "$KEY_PW"
            } >> "$HOME/.gradle/gradle.properties"
            tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          fi
          echo "signed=$has_key" >> "$GITHUB_OUTPUT"
          for e in $( [ "${{ needs.plan.outputs.android_app }}" = "both" ] && echo "js rust" || echo "${{ needs.plan.outputs.android_app }}" ); do
            suf=""; [ "$e" = "rust" ] && suf="-rust"
            if [ "$has_key" = "true" ]; then
              out="../dist-android/PearTube-$ver$suf-arm64.apk"
              ./gradlew --console=plain :app:assembleRelease "-Ppeartube.engine=$e"
              cp app/build/outputs/apk/release/app-release.apk "$out"
              "$tools/apksigner" verify "$out"
            else
              ./gradlew --console=plain :app:assembleDebug "-Ppeartube.engine=$e"
              cp app/build/outputs/apk/debug/app-debug.apk "../dist-android/PearTube-$ver$suf-debug-arm64.apk"
            fi
          done
          for e in $( [ "${{ needs.plan.outputs.android_tv }}" = "both" ] && echo "js rust" || echo "${{ needs.plan.outputs.android_tv }}" ); do
            suf=""; [ "$e" = "rust" ] && suf="-rust"
            if [ "$has_key" = "true" ]; then
              out="../dist-android/PearTubeReceiver-$ver$suf-arm64.apk"
              ./gradlew --console=plain :tv:assembleRelease "-Ppeartube.engine=$e"
              cp tv/build/outputs/apk/release/tv-release.apk "$out"
              "$tools/apksigner" verify "$out"
            else
              ./gradlew --console=plain :tv:assembleDebug "-Ppeartube.engine=$e"
              cp tv/build/outputs/apk/debug/tv-debug.apk "../dist-android/PearTubeReceiver-$ver$suf-debug-arm64.apk"
            fi
          done
          rm -f "$RUNNER_TEMP/release.jks" "$HOME/.gradle/gradle.properties"
      # Debug (.dev) APKs cannot update installed release apps: upload under release-* only when signed, or on artifact-only dispatch.
      - uses: actions/upload-artifact@v4
        if: steps.apk.outputs.signed == 'true' || needs.plan.outputs.release_tag == ''
        with:
          name: ${{ steps.apk.outputs.signed == 'true' && 'release-android-arm64' || 'debug-android-arm64' }}
          path: dist-android/*.apk
          if-no-files-found: error

  relay-build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: peartube
          fetch-depth: 0
      - id: meta
        working-directory: peartube
        run: |
          ver=$(node -p 'require("./package.json").version')
          commit=$(node -p 'JSON.parse(fs.readFileSync("./native.lock", "utf8")).commit')
          def_eng=$(node -p 'JSON.parse(fs.readFileSync("./native.lock", "utf8")).engine.relay || "js"')
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "native_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "default_engine=$def_eng" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/peartube-relay" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: (needs.plan.outputs.relay == 'rust' || needs.plan.outputs.relay == 'both') && (matrix.platform == 'linux/amd64' || needs.plan.outputs.release_tag != '')
        with:
          repository: ${{ github.repository_owner }}/peartube-native
          ref: ${{ steps.meta.outputs.native_commit }}
          path: stack/peartube-native
      - name: Checkout Rust stack crates at STACK.lock
        if: (needs.plan.outputs.relay == 'rust' || needs.plan.outputs.relay == 'both') && (matrix.platform == 'linux/amd64' || needs.plan.outputs.release_tag != '')
        run: |
          while read -r repo sha; do
            git clone --quiet "https://github.com/${{ github.repository_owner }}/$repo.git" "stack/$repo"
            git -C "stack/$repo" checkout --quiet "$sha"
          done < stack/peartube-native/STACK.lock
      - name: Build Linux x86_64 Rust relay binary tarball
        if: matrix.platform == 'linux/amd64' && (needs.plan.outputs.relay == 'rust' || needs.plan.outputs.relay == 'both')
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev
          cargo build --manifest-path stack/peartube-native/Cargo.toml --release --locked --bin peartube-relay
          mkdir -p relay-pkg/web dist-relay
          node -e "import('./peartube/src/ui.js').then(m => require('fs').writeFileSync('relay-pkg/web/index.html', m.page))"
          cp peartube/web/assets/peartube_web.wasm peartube/web/assets/peartube_web.wasm.gz peartube/web/assets/player-worker.js relay-pkg/web/
          cp stack/peartube-native/target/release/peartube-relay relay-pkg/
          tar -C relay-pkg -czf "dist-relay/peartube-relay-${{ steps.meta.outputs.ver }}-rust-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux/amd64' && (needs.plan.outputs.relay == 'rust' || needs.plan.outputs.relay == 'both')
        with:
          name: release-relay-linux-x64
          path: dist-relay/*.tar.gz
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v3
        if: needs.plan.outputs.release_tag != ''
      - uses: docker/login-action@v3
        if: needs.plan.outputs.release_tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push-js
        name: Push JS Relay Image Digest
        if: needs.plan.outputs.release_tag != '' && (needs.plan.outputs.relay == 'js' || needs.plan.outputs.relay == 'both')
        uses: docker/build-push-action@v6
        with:
          context: peartube
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - id: push-rust
        name: Push Rust Relay Image Digest
        if: needs.plan.outputs.release_tag != '' && (needs.plan.outputs.relay == 'rust' || needs.plan.outputs.relay == 'both')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stack/peartube-native/relay.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digests
        if: needs.plan.outputs.release_tag != ''
        run: |
          mkdir -p relay-digests
          [ -z "${{ steps.push-js.outputs.digest }}" ] || printf '%s\n' "${{ steps.push-js.outputs.digest }}" > "relay-digests/js-${{ runner.arch }}.txt"
          [ -z "${{ steps.push-rust.outputs.digest }}" ] || printf '%s\n' "${{ steps.push-rust.outputs.digest }}" > "relay-digests/rust-${{ runner.arch }}.txt"
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.release_tag != ''
        with:
          name: relay-digests-${{ runner.arch }}
          path: relay-digests/*.txt
          if-no-files-found: error
          retention-days: 1

  relay:
    needs: [plan, relay-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.release_tag != ''
        with:
          sparse-checkout: native.lock
          sparse-checkout-cone-mode: false
      - id: meta
        if: needs.plan.outputs.release_tag != ''
        run: |
          def_eng=$(node -p 'JSON.parse(fs.readFileSync("./native.lock", "utf8")).engine.relay || "js"')
          echo "default_engine=$def_eng" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/peartube-relay" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.release_tag != ''
        with:
          path: relay-digests
          pattern: relay-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
        if: needs.plan.outputs.release_tag != ''
      - uses: docker/login-action@v3
        if: needs.plan.outputs.release_tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create JS Relay Manifest
        if: needs.plan.outputs.release_tag != '' && (needs.plan.outputs.relay == 'js' || needs.plan.outputs.relay == 'both')
        working-directory: relay-digests
        run: |
          img="${{ steps.meta.outputs.image }}"
          tag="${{ needs.plan.outputs.release_tag }}"
          set -- -t "$img:js" -t "$img:$tag-js"
          if [ "${{ needs.plan.outputs.relay }}" = "js" ] || [ "${{ steps.meta.outputs.default_engine }}" = "js" ]; then
            set -- "$@" -t "$img:$tag" -t "$img:latest"
          fi
          for f in js-*.txt; do set -- "$@" "$img@$(cat "$f")"; done
          docker buildx imagetools create "$@"
      - name: Create Rust Relay Manifest
        if: needs.plan.outputs.release_tag != '' && (needs.plan.outputs.relay == 'rust' || needs.plan.outputs.relay == 'both')
        working-directory: relay-digests
        run: |
          img="${{ steps.meta.outputs.image }}"
          tag="${{ needs.plan.outputs.release_tag }}"
          set -- -t "$img:rust" -t "$img:$tag-rust"
          if [ "${{ needs.plan.outputs.relay }}" = "rust" ] || { [ "${{ needs.plan.outputs.relay }}" = "both" ] && [ "${{ steps.meta.outputs.default_engine }}" = "rust" ]; }; then
            set -- "$@" -t "$img:$tag" -t "$img:latest"
          fi
          for f in rust-*.txt; do set -- "$@" "$img@$(cat "$f")"; done
          docker buildx imagetools create "$@"

  publish:
    if: needs.plan.outputs.release_tag != ''
    needs: [plan, macos, android, relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      - name: Checksums & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          tag="${{ needs.plan.outputs.release_tag }}"
          sums="SHA256SUMS-${tag#v}.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" -D existing --clobber || true
            cp -n existing/* . 2>/dev/null || true
            rm -rf existing SHA256SUMS*
            sha256sum * > "$sums"
            gh release upload "$tag" * --clobber
          else
            sha256sum * > "$sums"
            gh release create "$tag" * --generate-notes --verify-tag
          fi
