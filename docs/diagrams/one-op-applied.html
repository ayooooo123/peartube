<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One op gets applied twice</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · personal store</p>
    <h1>One op gets applied twice, and lands in two different places</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="one-op-applied-title one-op-applied-desc">
      <title id="one-op-applied-title">Personal store apply and its determinism defect</title>
      <desc id="one-op-applied-desc">An op enters Autobase apply. Writer ops call host.addWriter, which is the correct pattern. Data ops are routed by type to a view collection. For a log-history op the key is built from a timestamp and an event id, both of which fall back to wall clock and randomness when the op omits them. Because Autobase replays the log after any reorder, the same op then lands under a different key. That fallback is the highlighted node.</desc>

      <defs>
        <pattern id="one-op-applied-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="one-op-applied-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="one-op-applied-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#one-op-applied-dots)" opacity="0.55"/>

      <!-- Connectors -->
      <line x1="260" y1="92" x2="260" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#one-op-applied-arrow)"/>
      <line x1="344" y1="148" x2="612" y2="148" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-op-applied-arrow)"/>
      <line x1="260" y1="176" x2="260" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#one-op-applied-arrow)"/>
      <line x1="344" y1="248" x2="612" y2="248" stroke="#4f5d75" stroke-width="1" marker-end="url(#one-op-applied-arrow)"/>
      <line x1="260" y1="276" x2="260" y2="312" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#one-op-applied-arrow-accent)"/>
      <line x1="260" y1="384" x2="260" y2="420" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#one-op-applied-arrow-accent)"/>
      <path d="M 360,448 H 428 Q 436,448 436,440 V 356" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#one-op-applied-arrow-accent)"/>

      <!-- Start -->
      <rect x="170" y="56" width="180" height="36" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="79" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">op enters apply</text>

      <!-- Gate 1: writer op? -->
      <polygon points="260,120 344,148 260,176 176,148" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="145" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">writer op?</text>
      <text x="260" y="158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">add · remove</text>
      <text x="356" y="142" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">yes</text>
      <text x="272" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">no</text>

      <rect x="616" y="130" width="300" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="766" y="147" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">host.addWriter(key, indexer)</text>
      <text x="766" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">an op in the log — the correct pattern</text>

      <!-- Gate 2: keyed by content? -->
      <polygon points="260,212 344,248 260,276 176,248" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="244" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">key from the op?</text>
      <text x="260" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">subscribe · playlist</text>
      <text x="356" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">yes</text>
      <text x="272" y="298" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">no — log-history</text>

      <rect x="616" y="230" width="300" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="766" y="247" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">view.put(collection / op.id)</text>
      <text x="766" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic · replays identically</text>

      <!-- FOCAL: the fallback -->
      <rect x="140" y="312" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="260" y="334" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">invent the missing parts</text>
      <text x="260" y="350" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">op.eventId || randomId()</text>
      <text x="260" y="363" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">op.timestamp || Date.now()</text>
      <text x="260" y="377" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">personal-store.js:192-193</text>

      <!-- Key construction -->
      <rect x="140" y="420" width="240" height="56" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="260" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">build the view key</text>
      <text x="260" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">history / time(ts) / eventId</text>

      <!-- The replay note -->
      <text x="452" y="330" fill="#eb6c36" font-size="10" font-family="'Geist', sans-serif" font-style="italic">Autobase replays the log</text>
      <text x="452" y="344" fill="#eb6c36" font-size="10" font-family="'Geist', sans-serif" font-style="italic">whenever history reorders.</text>
      <text x="452" y="358" fill="#eb6c36" font-size="10" font-family="'Geist', sans-serif" font-style="italic">Second pass, new random id,</text>
      <text x="452" y="372" fill="#eb6c36" font-size="10" font-family="'Geist', sans-serif" font-style="italic">new clock — new key.</text>
      <text x="452" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">the old entry is not replaced. it is orphaned.</text>

      <!-- Outcome -->
      <rect x="140" y="512" width="776" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="528" y="534" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">two peers replaying the same log build different views — and one peer diverges from itself</text>
      <text x="528" y="550" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">this does not heal · a later fix does not repair an existing log</text>

      <!-- Captions -->
      <text x="80" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">THE RULE</text>
      <text x="216" y="604" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">`apply` must be a pure function of the ops. No wall clock, no randomness, no reads of outside state — because it runs more than once on the same input.</text>
      <text x="80" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">THE FIX</text>
      <text x="216" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Stamp eventId and timestamps at append time, in the caller, and make `apply` reject an op that lacks them instead of inventing a fallback. Same for the four other Date.now() sites.</text>
    </svg>
  </div>
</body>
</html>
