mode: public
policy: discovery

storage:
  path: /var/lib/peartube-relay
  maxBytes: 107374182400

admission:
  channels: []
  owners: []

discovery:
  enabled: true
  maxChannels: 500
  maxChannelsPerOwner: 20

# Optional: archive YouTube channels into PearTube channels owned by this relay.
# Each source URL maps to one PearTube channel (deterministic per relay identity).
# yt-dlp must be available in PATH (the relay Docker image bundles it).
archive:
  enabled: false
  poll: 3600              # seconds between polls per source
  maxItems: 50            # videos to consider per poll, newest first
  maxRetries: 3           # give up on a video after this many consecutive failures
  budgetReservePercent: 5 # stop archiving when within N% of storage.maxBytes
  format: "bv*+ba/b"       # preserve original best video+audio when yt-dlp provides separate streams
  tmpPath: /var/lib/peartube-relay/archive-tmp  # yt-dlp scratch dir
  sources:
    - url: https://www.youtube.com/@somechannel
      label: Some Channel
    # - url: https://www.youtube.com/playlist?list=PLxxxxxxx

# Optional: seed your own on-disk media library into PearTube.
# Each folder becomes one or more channels; the relay keeps them available.
# SAFETY: disabled by default; audience defaults to `private` (never announced
# to the public feed). A `public` folder is scanned but NOT published until you
# confirm it with `peartube-relay library confirm <path>` (or set confirmed: true).
library:
  enabled: false
  pollSeconds: 300          # seconds between folder rescans
  caps:
    maxBytes: 0             # 0 = no library-specific cap (still bounded by storage.maxBytes)
  folders:
    - path: /media/Family   # mount read-only; originals are never modified
      audience: private     # private = your devices only, never the public feed
    # - path: /media/PublicMovies
    #   audience: public     # requires `library confirm` before it publishes
    #   confirmed: false

# Optional: delegate durable availability to a co-installed HiveRelay (Blindspark).
# When enabled, published library cores are handed to the relay via its
# publisher-signed seed-request API. Absent/unreachable relay = self-seed only.
hiverelay:
  enabled: false
  endpoint: null            # e.g. http://127.0.0.1:8181
  # authToken: null
  seedRequest:
    durability: 1           # 1 = archive class
    ttlSeconds: 2592000     # renewed automatically before expiry
    revocable: true
  verifyIntervalHours: 24

logging:
  level: info
