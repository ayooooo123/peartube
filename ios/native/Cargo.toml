[package]
name = "peartube-ios"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "peartube_ios"
crate-type = ["staticlib"]

[dependencies]
libc = "0.2"
serde_json = "1"
oxideav-core = "*"
player = { git = "https://github.com/ayooooo123/peartube-media", rev = "dce240d970416a9a89c68800d468dc9e0d4f1423" }
codecs = { git = "https://github.com/ayooooo123/peartube-media", rev = "dce240d970416a9a89c68800d468dc9e0d4f1423" }

[profile.release]
strip = true

[profile.dev.package."*"]
opt-level = 3

