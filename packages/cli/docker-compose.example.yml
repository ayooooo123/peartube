services:
  relay:
    image: ghcr.io/ayooooo123/peartube-relay:latest
    pull_policy: always
    restart: unless-stopped
    # Shell-less runtime image. Inspect with:
    # docker exec <container> /peartube-relay status --json
    environment:
      PEARTUBE_MODE: public
      PEARTUBE_POLICY: discovery
      PEARTUBE_STORAGE_PATH: /var/lib/peartube-relay
      PEARTUBE_STORAGE_MAX_BYTES: 107374182400
      PEARTUBE_DISCOVERY_ENABLED: "true"
      PEARTUBE_DISCOVERY_MAX_CHANNELS: 500
      PEARTUBE_DISCOVERY_MAX_CHANNELS_PER_OWNER: 20
      PEARTUBE_NETWORK_ANNOUNCE: "true"
      PEARTUBE_NETWORK_BOOTSTRAP: default
      PEARTUBE_LOG_LEVEL: info
      # TMDB powers the Discover catalog and auto-classifies archived videos as
      # movies/TV. Metadata only — you still archive bytes from a source URL.
      # Create a key at https://www.themoviedb.org/settings/api
      PEARTUBE_TMDB_API_KEY: your-tmdb-api-key-here
      PEARTUBE_TMDB_ENABLED: "true"
      # Optional S3-compatible archive configuration. Credentials stay in
      # environment variables and are never written to the relay feed.
      # PEARTUBE_ARCHIVE_S3_ENDPOINT: https://s3.example.com
      # PEARTUBE_ARCHIVE_S3_BUCKET: peartube-relay
      # PEARTUBE_ARCHIVE_S3_REGION: us-east-1
      # PEARTUBE_ARCHIVE_S3_ACCESS_KEY_ID: your-access-key
      # PEARTUBE_ARCHIVE_S3_SECRET_ACCESS_KEY: your-secret-key
      # PEARTUBE_ARCHIVE_S3_PREFIX: peartube/
      # PEARTUBE_ARCHIVE_S3_FORCE_PATH_STYLE: "false"
      # Block offload: move media block DATA to the bucket above and keep only
      # the merkle tree and bitfield on disk, so this relay can archive titles
      # larger than its volume. Off by default; a half-configured bucket refuses
      # to start rather than quietly filling the volume.
      # PEARTUBE_ARCHIVE_S3_OFFLOAD: "true"
      # Un-offloaded block data kept on local disk. Default 2 GiB.
      # PEARTUBE_ARCHIVE_S3_OFFLOAD_WINDOW_BYTES: "2147483648"
      # Optional allowlist keys for private or curated public mode:
      # PEARTUBE_ADMISSION_CHANNELS: chan-key-1,chan-key-2
      # PEARTUBE_ADMISSION_OWNERS: owner-key-1
      # Optional retention overrides:
      # PEARTUBE_RETENTION_PROTECT_PRIVATE: "true"
      # PEARTUBE_RETENTION_PROTECT_ALLOWLIST: "true"
    volumes:
      - peartube-relay-data:/var/lib/peartube-relay

volumes:
  peartube-relay-data:
